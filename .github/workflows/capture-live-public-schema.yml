name: Capture live public schema

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character workflow SHA (main for live capture)"
        required: true
        type: string
      owner_ack:
        description: "CAPTURE_SCHEMA_ONLY for live; RECOVER_REVIEWED_SCHEMA_ONLY or RECOVER_OPERATIONS_SCHEMA_ONLY for exact immutable TEST recovery"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: capture-live-public-schema
  cancel-in-progress: false

env:
  CRITICAL_ENVIRONMENT: dealer-swing-production-critical

jobs:
  validate-owner-dispatch:
    name: Require owner dispatch on exact main revision
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.owner_ack == 'CAPTURE_SCHEMA_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless owner initiated this run and rerun
        shell: bash
        env:
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          OWNER_ACK: ${{ inputs.owner_ack }}
        run: |
          set -euo pipefail
          test "$INITIAL_ACTOR" = "$REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          test "$OWNER_ACK" = CAPTURE_SCHEMA_ONLY

  capture:
    name: Capture schema-only application catalog
    needs: validate-owner-dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.owner_ack == 'CAPTURE_SCHEMA_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dealer-swing-production-critical
    steps:
      - name: Checkout current main for capture controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify capture SHA belongs to current main
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$TARGET_SHA" = "$(git rev-parse origin/main)"

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install pinned Supabase CLI
        shell: bash
        run: npm install --global supabase@2.101.0

      - name: Capture and validate schema-only public dump
        working-directory: VinPoker
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/live-public-schema"
          raw_schema_path="${RUNNER_TEMP}/live-public-schema.raw.sql"
          mkdir -p "$artifact_dir"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # Include every application-owned schema observed in the live catalog:
          # public RPCs depend on private Floor/game-table routines and spectator
          # projection triggers, while Storage supports Payroll PDF validation.
          # This remains schema-only: no rows are captured.
          supabase db dump --linked --schema public,storage,floor_private,private,spectator_projection_v2 --file "$raw_schema_path"
          node scripts/deploy/sanitize-live-public-schema-artifact.mjs \
            --input "$raw_schema_path" \
            --output "$artifact_dir/live-public-schema.sql"
          rm -f "$raw_schema_path"
          (cd "$artifact_dir" && sha256sum live-public-schema.sql) > "$artifact_dir/live-public-schema.sha256"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$artifact_dir"

      - name: Upload protected schema-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-public-schema
          path: ${{ runner.temp }}/live-public-schema
          if-no-files-found: error
          retention-days: 3

      - name: Record sanitized capture receipt
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/live-public-schema"
          schema_sha="$(awk '{print $1}' "$artifact_dir/live-public-schema.sha256")"
          project_fingerprint="$(printf '%s' "$SUPABASE_PROJECT_REF" | sha256sum | awk '{print $1}')"
          {
            echo "## Protected schema capture"
            echo
            echo "- Capture source SHA: \`$TARGET_SHA\`"
            echo "- Artifact name: \`live-public-schema\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Schema SHA-256: \`$schema_sha\`"
            echo "- Project fingerprint: \`$project_fingerprint\`"
            echo "- schema_names=public,storage,floor_private,private,spectator_projection_v2"
            echo "- schema_only=true"
            echo "- schema_artifact_sanitized=true"
            echo "- data_rows_captured=false"
            echo "- secrets_detected=false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-local schema dump
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/live-public-schema"
          rm -f "${RUNNER_TEMP}/live-public-schema.raw.sql"

  recover-reviewed-baseline:
    name: Recover immutable pre-release TEST schema (no live database access)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.owner_ack == 'RECOVER_REVIEWED_SCHEMA_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dealer-swing-production-critical
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify exact workflow revision and original capture provenance
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37229283609" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37229283609" --jq .head_sha)" = d64df388d42b51cb851e8d23361d4fe568988eb7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Recover bytes privately and validate exact original sanitized checksum
        env:
          BASELINE_01: ${{ secrets.VINPOKER_BASELINE_RECOVERY_01 }}
          BASELINE_02: ${{ secrets.VINPOKER_BASELINE_RECOVERY_02 }}
          BASELINE_03: ${{ secrets.VINPOKER_BASELINE_RECOVERY_03 }}
          BASELINE_04: ${{ secrets.VINPOKER_BASELINE_RECOVERY_04 }}
          BASELINE_05: ${{ secrets.VINPOKER_BASELINE_RECOVERY_05 }}
          BASELINE_06: ${{ secrets.VINPOKER_BASELINE_RECOVERY_06 }}
          BASELINE_07: ${{ secrets.VINPOKER_BASELINE_RECOVERY_07 }}
          BASELINE_08: ${{ secrets.VINPOKER_BASELINE_RECOVERY_08 }}
          BASELINE_09: ${{ secrets.VINPOKER_BASELINE_RECOVERY_09 }}
          BASELINE_10: ${{ secrets.VINPOKER_BASELINE_RECOVERY_10 }}
          BASELINE_11: ${{ secrets.VINPOKER_BASELINE_RECOVERY_11 }}
          BASELINE_12: ${{ secrets.VINPOKER_BASELINE_RECOVERY_12 }}
          BASELINE_13: ${{ secrets.VINPOKER_BASELINE_RECOVERY_13 }}
          BASELINE_14: ${{ secrets.VINPOKER_BASELINE_RECOVERY_14 }}
          BASELINE_15: ${{ secrets.VINPOKER_BASELINE_RECOVERY_15 }}
          BASELINE_16: ${{ secrets.VINPOKER_BASELINE_RECOVERY_16 }}
          BASELINE_17: ${{ secrets.VINPOKER_BASELINE_RECOVERY_17 }}
        run: node VinPoker/scripts/deploy/recover-reviewed-schema-artifact.mjs
      - name: Retain original immutable baseline for replay tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-pre-release-schema
          path: ${{ runner.temp }}/reviewed-pre-release-schema
          if-no-files-found: error
          retention-days: 90
      - name: Upload metadata-only recovery provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-pre-release-schema-provenance
          path: ${{ runner.temp }}/reviewed-pre-release-schema.provenance.json
          if-no-files-found: error
          retention-days: 90

  recover-operations-baseline:
    name: Recover immutable Operations TEST schema (no live database access)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.owner_ack == 'RECOVER_OPERATIONS_SCHEMA_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dealer-swing-production-critical
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify exact workflow revision and original Operations capture provenance
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .head_sha)" = 0463831bb9f8f142d585fd51c1b0633963b2161f
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Recover privately and require exact Operations snapshot checksum
        env:
          RECOVERY_PROFILE: operations
          BASELINE_01: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_01 }}
          BASELINE_02: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_02 }}
          BASELINE_03: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_03 }}
          BASELINE_04: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_04 }}
          BASELINE_05: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_05 }}
          BASELINE_06: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_06 }}
          BASELINE_07: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_07 }}
          BASELINE_08: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_08 }}
          BASELINE_09: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_09 }}
          BASELINE_10: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_10 }}
          BASELINE_11: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_11 }}
          BASELINE_12: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_12 }}
          BASELINE_13: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_13 }}
          BASELINE_14: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_14 }}
          BASELINE_15: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_15 }}
          BASELINE_16: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_16 }}
          BASELINE_17: ${{ secrets.VINPOKER_OPS_SCHEMA_RECOVERY_17 }}
        run: node VinPoker/scripts/deploy/recover-reviewed-schema-artifact.mjs
      - name: Retain exact original Operations snapshot for existing runtime tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-operations-schema
          path: ${{ runner.temp }}/reviewed-operations-schema
          if-no-files-found: error
          retention-days: 90
      - name: Upload metadata-only Operations recovery provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-operations-schema-provenance
          path: ${{ runner.temp }}/reviewed-operations-schema.provenance.json
          if-no-files-found: error
          retention-days: 90
