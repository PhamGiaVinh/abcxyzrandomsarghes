name: Floor345 exact protected migration apply
on:
  pull_request:
    paths:
      - ".github/workflows/floor-fast-bust-345-protected-apply.yml"
      - "VinPoker/scripts/ops/floor-fast-bust-345-*"
  workflow_dispatch:
    inputs:
      apply345: {description: Explicit exact approved345 application; default OFF, required: true, default: false, type: boolean}
      manifest_sha256: {description: Exact reviewed345 manifest digest, required: true, type: string}
      release_sha: {description: Exact reviewed source SHA, required: true, type: string}
      source_pr: {description: Exact open source PR number, required: true, type: string}
      recovery_run_id: {description: Successful fresh restore-verified recovery run, required: true, type: string}
      recovery_base_sha: {description: Exact main SHA that created recovery, required: true, type: string}
      confirmation: {description: APPLY_FLOOR_345_<release_sha>, required: true, type: string}
permissions: {actions: read, contents: read, checks: read, pull-requests: read}
concurrency: {group: vinpoker-production-database-release, cancel-in-progress: false}
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: runner}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 438290856c05fe426e41be0a385fd4431d4ffe16, path: release}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Offline exact controller and approval rejection tests
        working-directory: runner/VinPoker
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release/VinPoker
        run: node --test scripts/ops/floor-fast-bust-345-protected-apply.test.mjs
  atomic-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_floor345
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vinpoker_ops_floor345"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_floor345
      SCHEMA_ARTIFACT_SHA256: 35fc93f15fac55fe63386f06b5da7ea497e5e68aadb5168616c11cca202f66e7
      SCHEMA_ARTIFACT_DIR: /tmp/floor345-fresh-schema
    steps:
      - uses: actions/checkout@v4
        with: {path: controls}
      - uses: actions/checkout@v4
        with:
          ref: 438290856c05fe426e41be0a385fd4431d4ffe16
          path: candidate
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Download owner-approved fresh schema with immutable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43471170552" > "$RUNNER_TEMP/capture.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14062030756" > "$RUNNER_TEMP/artifact.json"
          gh run download 43471170552 --repo "$GITHUB_REPOSITORY" --name live-public-schema --dir "$SCHEMA_ARTIFACT_DIR"
          node controls/VinPoker/scripts/ops/floor345-fresh-baseline.mjs "$RUNNER_TEMP/capture.json" "$RUNNER_TEMP/artifact.json" "$SCHEMA_ARTIFACT_DIR" candidate/VinPoker/supabase/migrations/20270128000345_floor_operator_fast_bust_v1.sql
      - name: Restore actual current schema in empty isolated PostgreSQL only
        working-directory: controls/VinPoker
        run: node scripts/ops/restore-schema-test-baseline.mjs
      - name: Real PostgreSQL atomic rollback, canonical receipt and duplicate rejection
        working-directory: controls/VinPoker
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/candidate/VinPoker
        run: node scripts/ops/floor-fast-bust-345-atomic-postgres.mjs
  validate:
    needs: [unit-tests, atomic-postgres]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply345 == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.release_sha }}', fetch-depth: 0, path: release}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', fetch-depth: 1, path: runner}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Bind owner, open source PR and exact-SHA checks
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_SHA: '${{ inputs.release_sha }}'
          SOURCE_PR: '${{ inputs.source_pr }}'
          INITIAL_ACTOR: '${{ github.actor }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          CONFIRMATION: '${{ inputs.confirmation }}'
          MANIFEST_SHA256: '${{ inputs.manifest_sha256 }}'
        run: |
          set -euo pipefail
          test "$INITIAL_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_PR" =~ ^[0-9]+$ ]]
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C runner rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SOURCE_PR" = 1638
          test "$MANIFEST_SHA256" = 83f468cb5f3112a1296f2e106bd43464cce6b0fbac53e6d17768e70a31ba4576
          test "$CONFIRMATION" = "APPLY_FLOOR_345_$RELEASE_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")"
          test "$(jq -r .head.sha <<<"$pr")" = "$RELEASE_SHA"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .base.sha <<<"$pr")" = "$GITHUB_SHA"
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY"
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          for name in runtime ops-floor-cashier-disposable-db floor-table-control-v3-server-contract floor-table-control-v3 floor-disposable-db postgres-17 frontend release-runner-postgres-17 collision-guard reject-sensitive-vars-context 'Floor V3 catalog and promotion preflight'; do
            jq -e --arg name "$name" '[.check_runs[]|select(.name==$name and .app.slug=="github-actions") ]|sort_by(.id)|last|.status=="completed" and .conclusion=="success"' <<<"$checks" >/dev/null
          done
      - name: Offline exact migration checks
        working-directory: release/VinPoker
        run: |
          npm run check:migration-catalog
          RELEASE_SOURCE_ROOT="$GITHUB_WORKSPACE/release/VinPoker" node --test "$GITHUB_WORKSPACE/runner/VinPoker/scripts/ops/floor-fast-bust-345-protected-apply.test.mjs"
  apply:
    needs: validate
    environment: dealer-swing-production-critical
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.release_sha }}', fetch-depth: 0, path: release}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', fetch-depth: 1, path: runner}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Verify recovery provenance and download metadata only
        env:
          GH_TOKEN: '${{ github.token }}'
          RECOVERY_RUN_ID: '${{ inputs.recovery_run_id }}'
          RECOVERY_BASE_SHA: '${{ inputs.recovery_base_sha }}'
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RECOVERY_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          test "$(jq -r .workflow_id <<<"$run")" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/floor-v3-recovery-backup.yml" --jq .id)"
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .actor.login <<<"$run")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r .triggering_actor.login <<<"$run")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .head_sha <<<"$run")" = "$RECOVERY_BASE_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts")"
          artifact="$(jq -ce --arg name "floor-v3-restore-verification-$RECOVERY_RUN_ID" '[.artifacts[]|select(.name==$name and .expired==false and .size_in_bytes>0)]|if length==1 then .[0] else error("missing recovery") end' <<<"$artifacts")"
          mkdir "$RUNNER_TEMP/floor345-recovery-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(jq -r .id <<<"$artifact")/zip" >"$RUNNER_TEMP/floor345-recovery.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/floor345-recovery.zip")" = recovery-verification.json
          test "$(sha256sum "$RUNNER_TEMP/floor345-recovery.zip" | cut -d " " -f1)" = "$(jq -r .digest <<<"$artifact" | sed "s/^sha256://")"
          unzip -q "$RUNNER_TEMP/floor345-recovery.zip" -d "$RUNNER_TEMP/floor345-recovery-receipt"
          echo "RECOVERY_RECEIPT_PATH=$RUNNER_TEMP/floor345-recovery-receipt/recovery-verification.json" >>"$GITHUB_ENV"
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[]|select((.id|tostring)!=env.GITHUB_RUN_ID)|select(.event=="workflow_dispatch")|select(.status=="in_progress" or .status=="waiting" or .status=="queued")|select(.name|test("database|migration|recovery|protected.*apply|release";"i"))|.id')"
          test -z "$active"
      - name: Revalidate owner, source PR and checks after protected approval
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_SHA: '${{ inputs.release_sha }}'
          SOURCE_PR: '${{ inputs.source_pr }}'
          INITIAL_ACTOR: '${{ github.actor }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          CONFIRMATION: '${{ inputs.confirmation }}'
          MANIFEST_SHA256: '${{ inputs.manifest_sha256 }}'
        run: |
          set -euo pipefail
          test "$INITIAL_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_PR" =~ ^[0-9]+$ ]]
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C runner rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SOURCE_PR" = 1638
          test "$MANIFEST_SHA256" = 83f468cb5f3112a1296f2e106bd43464cce6b0fbac53e6d17768e70a31ba4576
          test "$CONFIRMATION" = "APPLY_FLOOR_345_$RELEASE_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")"
          test "$(jq -r .head.sha <<<"$pr")" = "$RELEASE_SHA"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .base.sha <<<"$pr")" = "$GITHUB_SHA"
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY"
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          for name in runtime ops-floor-cashier-disposable-db floor-table-control-v3-server-contract floor-table-control-v3 floor-disposable-db postgres-17 frontend release-runner-postgres-17 collision-guard reject-sensitive-vars-context 'Floor V3 catalog and promotion preflight'; do
            jq -e --arg name "$name" '[.check_runs[]|select(.name==$name and .app.slug=="github-actions") ]|sort_by(.id)|last|.status=="completed" and .conclusion=="success"' <<<"$checks" >/dev/null
          done
      - name: Plan then exact atomic345 apply
        working-directory: runner/VinPoker
        env:
          RELEASE_SOURCE_ROOT: '${{ github.workspace }}/release/VinPoker'
          MANIFEST_SHA256: '${{ inputs.manifest_sha256 }}'
          SOURCE_PR_BASE_SHA: '${{ github.sha }}'
          RELEASE_SHA: '${{ inputs.release_sha }}'
          SOURCE_CHECKOUT_SHA: '${{ inputs.release_sha }}'
          RECOVERY_BASE_SHA: '${{ inputs.recovery_base_sha }}'
          INITIAL_ACTOR: '${{ github.actor }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          REPOSITORY_OWNER: '${{ github.repository_owner }}'
          SUPABASE_PROJECT_REF: '${{ secrets.SUPABASE_PROJECT_REF }}'
          PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.orlesggcjamwuknxwcpk
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: '${{ secrets.SUPABASE_DB_PASSWORD }}'
          CONFIRM_FLOOR_PACKAGE: '${{ inputs.confirmation }}'
        run: |
          set -euo pipefail
          node scripts/ops/floor-fast-bust-345-protected-apply.mjs plan | tee "$RUNNER_TEMP/floor345-plan.txt"
          node scripts/ops/floor-fast-bust-345-protected-apply.mjs apply | tee "$RUNNER_TEMP/floor345-apply.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: floor345-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floor345-plan.txt
            ${{ runner.temp }}/floor345-apply.txt
          if-no-files-found: warn
          retention-days: 30
