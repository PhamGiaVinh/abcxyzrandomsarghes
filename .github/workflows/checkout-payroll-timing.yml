name: Checkout while saving payroll on isolated DB
on:
  pull_request:
    paths:
      - '.github/workflows/checkout-payroll-timing.yml'
      - 'VinPoker/tests/dealerSwing/l09CheckoutPayroll.*'
      - 'VinPoker/tests/dealerSwing/l08BulkSalaryConcurrency.sh'
      - 'VinPoker/tests/dealerSwing/l08BulkSalaryClient.mjs'
permissions:
  actions: read
  contents: read
jobs:
  checkout-payroll-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_l09
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d vinpoker_ops_l09"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_l09
      CAPTURE_RUN: '44484017071'
      CAPTURE_SHA: '02c4d6cba8678c9d52feea055fc1f0714082bc77'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify capture provenance and restore schema on loopback
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/l09-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER"             '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and
             .event == "workflow_dispatch" and .actor.login == $owner and
             .path == ".github/workflows/capture-live-public-schema.yml"'             "$RUNNER_TEMP/l09-capture.json" > /dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/l09-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Verify stale bulk salary updates with independent database connections
        working-directory: VinPoker
        run: bash tests/dealerSwing/l08BulkSalaryConcurrency.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install pinned client qualification dependencies
        working-directory: VinPoker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for actual bulk salary client qualification
        working-directory: VinPoker
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify bulk salary client through real isolated HTTP and PostgreSQL
        working-directory: VinPoker
        run: node tests/dealerSwing/l08BulkSalaryClient.mjs
      - name: Measure checkout and payroll with independent database connections
        working-directory: VinPoker
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = vinpoker_ops_l09
          bash tests/dealerSwing/l09CheckoutPayroll.sh "$RUNNER_TEMP/l09-result"
      - name: Save fixture timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l09-fixture-timings
          path: ${{ runner.temp }}/l09-result/
          if-no-files-found: ignore
      - name: Save bulk salary HTTP client evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l08-bulk-salary-http
          path: ${{ runner.temp }}/l08-client/
          if-no-files-found: error
