name: Finance expense scope isolated PostgreSQL
on:
  pull_request:
    paths:
      - '.github/workflows/finance-expense-scope.yml'
      - 'VinPoker/tests/financeExpenses/**'
      - 'VinPoker/supabase/pending-migrations/20270128000354_finance_expense_scope_idempotency.sql'
permissions:
  actions: read
  contents: read
jobs:
  reproduce-captured-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_finance_expense
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vinpoker_ops_finance_expense"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_finance_expense
      CAPTURE_RUN: '45651278424'
      CAPTURE_SHA: 'c9dba24211152ddf5f010a46d0afab118cfbf482'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify approved schema capture and restore on loopback only
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/finance-expense-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and
             .event == "workflow_dispatch" and .actor.login == $owner and
             .path == ".github/workflows/capture-live-public-schema.yml"' \
            "$RUNNER_TEMP/finance-expense-capture.json" > /dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/finance-expense-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          test "$SCHEMA_ARTIFACT_SHA256" = f81104251d6c79fdae537e0ca2faa7afa2ddc186eafadcb3bd4781276478b7d8
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Reproduce existing bugs without applying product changes
        run: psql -X -v ON_ERROR_STOP=1 -f VinPoker/tests/financeExpenses/scope.baseline.sql
      - name: Save exact rollback preimage and install isolated candidate
        run: |
          set -euo pipefail
          psql -X -At -v ON_ERROR_STOP=1 -c "SELECT pg_get_functiondef('public.record_club_expense(uuid,public.expense_category,bigint,timestamptz,text,text,text,uuid,uuid,text,uuid,text)'::regprocedure)" > "$RUNNER_TEMP/expense-reader-original.sql"
          psql -X -v ON_ERROR_STOP=1 -f VinPoker/supabase/pending-migrations/20270128000354_finance_expense_scope_idempotency.sql
      - name: Verify valid adjustments, exact retries, rejection without writes and revoked roles
        run: psql -X -v ON_ERROR_STOP=1 -f VinPoker/tests/financeExpenses/scope.candidate.sql
      - name: Exercise same-key intents on independent connections with an observed lock barrier
        working-directory: VinPoker
        run: bash tests/financeExpenses/scope.concurrent.sh "$RUNNER_TEMP/finance-expense-race"
      - name: Verify actual HTTP intents flow through to the expense report
        run: node VinPoker/tests/financeExpenses/scope.http.mjs
      - name: Verify rollback restores original RPC source
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/expense-reader-original.sql"
          test "$(psql -X -Atqc "SELECT md5(prosrc) FROM pg_proc WHERE oid='public.record_club_expense(uuid,public.expense_category,bigint,timestamptz,text,text,text,uuid,uuid,text,uuid,text)'::regprocedure")" = ec4209e4c6e11503ecd4e52c5d4be0ee
      - name: Remove runner-local schema artifact
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/finance-expense-schema"
