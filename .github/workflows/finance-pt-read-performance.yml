name: PT payslip and finance report read performance
on:
  pull_request:
    # PR paths use the entire three-dot PR diff, so paths would start another
    # 30-minute run on every unrelated synchronize. Require deliberate opt-in.
    types: [labeled]
permissions:
  actions: read
  contents: read
jobs:
  pt-read-performance:
    if: >-
      github.event.action == 'labeled' &&
      (github.event.label.name == 'qualify-pt-read-performance' || github.event.label.name == 'diagnose-pt-report-cold-start') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_pt_installment
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d vinpoker_ops_pt_installment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_pt_installment
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CAPTURE_RUN: '45651278424'
      CAPTURE_SHA: 'c9dba24211152ddf5f010a46d0afab118cfbf482'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Check qualification refuses short missing duplicate timeout and slow samples
        working-directory: VinPoker
        run: node --test tests/financePayrollReadPerformance/qualification.test.mjs
      - name: Verify exact schema-only provenance and restore disposable database
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/pt-read-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" '
            .conclusion == "success" and .head_sha == $sha and .head_branch == "main" and
            .event == "workflow_dispatch" and .actor.login == $owner and
            .path == ".github/workflows/capture-live-public-schema.yml"' "$RUNNER_TEMP/pt-read-capture.json" > /dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/pt-read-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          test "$SCHEMA_ARTIFACT_SHA256" = f81104251d6c79fdae537e0ca2faa7afa2ddc186eafadcb3bd4781276478b7d8
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Install reviewed pending SQL and synthetic 100000 document read fixture
        working-directory: VinPoker
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/pending-migrations/finance_pt_installments_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/financePayrollReadPerformance/read-performance.seed.sql
      - name: Observe twenty distinct readers through real RPC for thirty minutes
        if: github.event.label.name == 'qualify-pt-read-performance'
        working-directory: VinPoker
        run: node tests/financePayrollReadPerformance/read-performance.mjs
      - name: Diagnose cold report connections and JIT using ON OFF ON cohorts
        if: github.event.label.name == 'diagnose-pt-report-cold-start'
        working-directory: VinPoker
        run: node tests/financePayrollReadPerformance/cold-report-diagnostic.mjs
      - name: Upload aggregate and synthetic sample evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pt-read-performance-sanitized
          path: |
            ${{ runner.temp }}/pt-read-performance.json
            ${{ runner.temp }}/pt-read-trace-*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Remove runner-local schema artifact
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pt-read-schema"
