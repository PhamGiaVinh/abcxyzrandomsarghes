name: Cash count input
on:
  pull_request:
    paths:
      - 'VinPoker/src/pages/ops/TourCashierWorkbench*'
      - '.github/workflows/cash-count-input.yml'
permissions:
  contents: read
jobs:
  cash-count-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VinPoker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- src/pages/ops/TourCashierWorkbenchShift.test.tsx -t "requires the opening cash|rejects blank cash counts"
