name: Tracker BB ante exact release source qualification

on:
  pull_request:
    paths:
      - .github/workflows/tracker-bb-ante-release-qualification.yml
      - VinPoker/scripts/ops/tracker-bb-ante-release*.mjs
      - VinPoker/scripts/ops/tracker-bb-ante-consumers*.mjs
      - .github/workflows/tracker-bb-ante-protected-apply.yml
      - VinPoker/supabase/migrations/20270128000350_tracker_bb_ante_atomic_v1.sql
      - VinPoker/supabase/migrations/20270128000351_tracker_bb_ante_settlement_v1.sql

permissions:
  contents: read

jobs:
  exact-release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: runner}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '3c6e2080a0afd2f611693ff13b280d368df886a3', path: release}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Qualify immutable SQL sources and guarded apply behavior without credentials
        working-directory: runner/VinPoker
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release/VinPoker
        run: |
          node scripts/ops/tracker-bb-ante-release.mjs verify-source
          RESUME_CONSUMER_RUN_ID=45398872397 node scripts/ops/tracker-bb-ante-release.mjs qualify-source-tree
          node --test scripts/ops/tracker-bb-ante-release.test.mjs
          node --test scripts/ops/tracker-bb-ante-consumers.test.mjs
