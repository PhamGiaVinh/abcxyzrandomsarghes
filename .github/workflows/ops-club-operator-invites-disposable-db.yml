name: Ops club operator invites disposable PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/ops-club-operator-invites-disposable-db.yml"
      - "VinPoker/supabase/migration-archive/superseded/remote-alias/20270108000000_ops_operator_membership_baseline.sql"
      - "VinPoker/supabase/migration-archive/superseded/remote-alias/20270108000001_ops_club_operator_invites.sql"
      - "VinPoker/supabase/functions/ops-club-accounts/**"
      - "VinPoker/supabase/pending-migrations/20261119141550_ops_dealer_control_invites.sql"
      - "VinPoker/src/ops/auth/**"
      - "VinPoker/src/ops/pages/OpsAccount.tsx"
      - "VinPoker/tests/ops/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-club-operator-invites-disposable-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Ops migrations and run disposable proof
        working-directory: VinPoker
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/ops/disposableDb.integration.sql
          dealer_scope_fixture="$(mktemp)"
          trap 'rm -f "$dealer_scope_fixture"' EXIT
          sed -n '/^CREATE OR REPLACE FUNCTION public.dealer_control_club_ids(/,/^\$\$;/p' \
            supabase/migrations/20260522000001_dealer_swing_manager.sql > "$dealer_scope_fixture"
          test -s "$dealer_scope_fixture"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v dealer_scope_fixture="$dealer_scope_fixture" \
            -f tests/ops/dealerControlInvite.disposable.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ops_baseline_incompatible"
          if psql -h localhost -U postgres -d ops_baseline_incompatible -v ON_ERROR_STOP=1 \
            -f tests/ops/disposableDb.incompatible.sql; then
            echo "incompatible baseline unexpectedly succeeded" >&2
            exit 1
          fi
          psql -h localhost -U postgres -d ops_baseline_incompatible -v ON_ERROR_STOP=1 \
            -f tests/ops/disposableDb.incompatible.verify.sql

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: Verify open Dealer Swing against actual PostgreSQL revocation
        if: github.event_name == 'workflow_dispatch'
        working-directory: VinPoker
        env:
          LOCAL_R02_BROWSER: '1'
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-fixture-only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA auth TO authenticated'
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test e2e/dealer-swing-revocation.disposable.spec.ts --project chromium --workers 1
