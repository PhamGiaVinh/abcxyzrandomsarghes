name: Spectator batch protected Edge release
on:
  pull_request:
    paths:
      - '.github/workflows/spectator342344-edge-release.yml'
      - 'VinPoker/scripts/ops/spectator342344-edge-release*'
  workflow_dispatch:
    inputs:
      operation: {description: Deploy candidate or restore verified prior code, type: choice, required: true, default: deploy, options: [deploy, restore-prior]}
      prior_release_run_id: {description: Prior release run containing the verified six-file backup, type: string, required: false}
      confirmation: {description: RELEASE_SPECTATOR_BATCH_<exact main SHA>, required: true, type: string}
permissions: {contents: read, actions: read, pull-requests: read}
concurrency: {group: vinpoker-production-database-release, cancel-in-progress: false}
jobs:
  edge-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 10}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Ordered activation, source and rollback guards
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/VinPoker
        run: node --test VinPoker/scripts/ops/spectator342344-edge-release.test.mjs
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: edge-controls
    environment: dealer-swing-production-critical
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Install existing pinned deployment CLI
        run: npm install --global supabase@2.101.0
      - name: Capture verified prior source before any production change
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRM_EDGE_RELEASE: ${{ inputs.confirmation }}
        run: node VinPoker/scripts/ops/spectator342344-edge-release.mjs capture-prior
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.operation == 'deploy'
        with:
          name: spectator-prior-v12-${{ github.run_id }}
          path: ${{ runner.temp }}/spectator-prior-v12
          if-no-files-found: error
      - name: Controlled candidate release or verified prior-code restore
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRM_EDGE_RELEASE: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
          PRIOR_RELEASE_RUN_ID: ${{ inputs.prior_release_run_id }}
        run: |
          set -euo pipefail
          node VinPoker/scripts/ops/spectator342344-edge-release.mjs "$OPERATION" | tee "$RUNNER_TEMP/spectator-edge-release.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spectator-edge-release-${{ github.run_id }}
          path: ${{ runner.temp }}/spectator-edge-release.jsonl
          if-no-files-found: ignore
