name: Tracker Voice V0 disposable PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/tracker-voice-v0-disposable-db.yml"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20260928000000_tracker_lock_activation_idempotency_trace.sql"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20261221000000_tracker_lock_takeover.sql"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20270105000004_floor_table_control_mode.sql"
      - "VinPoker/supabase/migrations/20270108000003_tracker_unified_ops_v2_context_safe_start.sql"
      - "VinPoker/supabase/migrations/20270112000003_tracker_voice_player_analytics_v0.sql"
      - "VinPoker/supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql"
      - "VinPoker/supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql"
      - "VinPoker/supabase/migrations/20270112000006_tracker_terminal_hand_rpc_authority.sql"
      - "VinPoker/supabase/migrations/20270112000007_tracker_p0_authority_closure.sql"
      - "VinPoker/supabase/migrations/20270112000008_tracker_voice_gemini_live_provider.sql"
      - "VinPoker/supabase/migrations/20270113000002_floor_table_control_v3_foundation.sql"
      - "VinPoker/supabase/migrations/20270113000010_floor_table_control_v3_final_live_bridge.sql"
      - "VinPoker/supabase/migrations/20270113000011_floor_table_control_v3_final_contract.sql"
      - "VinPoker/supabase/migrations/20270113000012_floor_table_control_v3_production_enable.sql"
      - "VinPoker/supabase/migrations/20270113000007_tracker_voice_transcribe35_binding.sql"
      - "VinPoker/supabase/migrations/20270113000009_tracker_voice_board_atomic_commit_v0.sql"
      - "VinPoker/supabase/migrations/20270114000001_tracker_voice_hole_cards_atomic_confirm_v0.sql"
      - "VinPoker/supabase/migrations/20270114000002_tracker_voice_finish_atomic_commit_v0.sql"
      - "VinPoker/supabase/migrations/20270114000003_tracker_voice_snake_case_canonical_hash_v2.sql"
      - "VinPoker/supabase/migrations/20270114000004_tracker_voice_floor_mode_global_rollout.sql"
      - "VinPoker/supabase/migrations/20270114000009_tracker_voice_provider_event_idempotency.sql"
      - "VinPoker/supabase/migrations/20270114000010_tracker_voice_covering_stack_hole_cards.sql"
      - "VinPoker/supabase/migrations/20270115000005_tracker_dealer_floor_operational_alerts.sql"
      - "VinPoker/supabase/migrations/20270115000013_tracker_correction_capability_disabled.sql"
      - "VinPoker/supabase/migrations/20270115000014_tracker_floor_alert_action_reference.sql"
      - "VinPoker/tests/trackerCorrectionRelease1/**"
      - "VinPoker/supabase/migrations/20270115000016_tracker_correction_uat_release2.sql"
      - "VinPoker/tests/trackerCorrectionRelease2/**"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20270115000002_tracker_hand_correction_commit_receipt.sql"
      - "VinPoker/supabase/migrations/20270115000017_tracker_completed_hand_correction_uat.sql"
      - "VinPoker/tests/trackerCorrectionRelease3/**"
      - "VinPoker/supabase/functions/tournament-live-resettle-commit/**"
      - "VinPoker/supabase/migrations/20270115000015_tracker_voice_dealer_handoff_authority.sql"
      - "VinPoker/supabase/migrations/20270115000018_dealer_assignment_session_binding.sql"
      - "VinPoker/supabase/migrations/20270115000020_tracker_voice_floor_owner_authority.sql"
      - "VinPoker/supabase/migrations/20270128000005_tracker_correction_floor_tracker_authority.sql"
      - "VinPoker/supabase/migrations/20270128000008_tracker_voice_floor_owner_telegram_dealer.sql"
      - "VinPoker/supabase/functions/_shared/trackerSettlement/finishAssist.ts"
      - "VinPoker/supabase/functions/_shared/trackerPlayerAnalytics.ts"
      - "VinPoker/supabase/functions/_shared/trackerVoiceParser.ts"
      - "VinPoker/supabase/functions/tracker-player-analytics/**"
      - "VinPoker/supabase/functions/tracker-voice-session/**"
      - "VinPoker/supabase/functions/tournament-live-update/index.ts"
      - "VinPoker/src/lib/trackerVoice/**"
      - "VinPoker/src/lib/tournament/observeTrackerContextRead.ts"
      - "VinPoker/src/components/tracker/voice/**"
      - "VinPoker/src/components/tracker/DealerTabletCockpit*"
      - "VinPoker/src/components/tracker/DealerShotClock*"
      - "VinPoker/src/components/cashier/tournament-live/handinput/**"
      - "VinPoker/tests/trackerVoice/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-voice-v0-disposable-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install source-test dependencies without install hooks
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Create sanitized current-P0 baseline without Unified Ops or Voice
        working-directory: VinPoker
        run: |
          set -euo pipefail
          createdb tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f tests/trackerUnifiedOps/disposableDb.baseline.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f tests/trackerVoice/disposableDb.dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migration-archive/historical-never-replay/20260928000000_tracker_lock_activation_idempotency_trace.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migration-archive/historical-never-replay/20270105000004_floor_table_control_mode.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migration-archive/historical-never-replay/20261221000000_tracker_lock_takeover.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000006_tracker_terminal_hand_rpc_authority.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000007_tracker_p0_authority_closure.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public._tracker_unified_ops_request_hash_v2(jsonb)') IS NULL
                    AND to_regclass('public.tracker_voice_configs') IS NULL
                    AND NOT EXISTS (
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'tournament_hands'
                        AND column_name = 'tracker_lock_version'
                    )")" = "t"
          createdb tracker_voice_v0_before_080 -T tracker_voice_v0

      - name: Apply the exact future chain after current P0 and capture catalog evidence
        working-directory: VinPoker
        run: |
          set -euo pipefail
          protected_digest() {
            psql -X -At -d tracker_voice_v0 -c "
              SELECT md5(string_agg(
                p.oid::regprocedure::text || E'\\n' || pg_get_functiondef(p.oid) || E'\\n'
                || pg_get_userbyid(p.proowner) || E'\\n' || coalesce(array_to_string(p.proconfig, ';'), '')
                || E'\\n' || coalesce(array_to_string(p.proacl, ';'), ''),
                E'\\n---\\n' ORDER BY p.oid::regprocedure::text
              ))
              FROM pg_proc p
              WHERE p.oid::regprocedure::text IN (
                'start_hand(uuid,uuid,integer,timestamp with time zone,uuid,integer)',
                'update_community_cards(uuid,jsonb,uuid)',
                'show_hole_cards(uuid,jsonb,uuid)',
                'delete_last_action(uuid,uuid)',
                'void_last_hand(uuid)',
                'cleanup_orphan_hands(interval)',
                'takeover_hand_lock(uuid,boolean,uuid)'
              )"
          }
          before_p0_digest="$(protected_digest)"
          echo "TRACKER_VOICE_P0_CATALOG_BEFORE=$before_p0_digest"
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270108000003_tracker_unified_ops_v2_context_safe_start.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public._tracker_unified_ops_request_hash_v2(jsonb)') IS NOT NULL
                    AND to_regprocedure('public.tracker_unified_ops_lock_tournament(uuid)') IS NOT NULL
                    AND EXISTS (
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'tournament_hands'
                        AND column_name = 'tracker_lock_version'
                    )")" = "t"
          echo "TRACKER_VOICE_080_APPLY=PASS"
          createdb tracker_voice_v0_before_12003 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000003_tracker_voice_player_analytics_v0.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regclass('public.tracker_voice_configs') IS NOT NULL
                    AND to_regclass('public.tracker_voice_events') IS NOT NULL
                    AND to_regprocedure('public._tracker_voice_register_validated_event(uuid,uuid,uuid,uuid,text,text,text,numeric,text,jsonb,text,text,text,text,text,boolean,text)') IS NOT NULL")" = "t"
          echo "TRACKER_VOICE_12003_APPLY=PASS"
          createdb tracker_voice_v0_before_12008 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270112000008_tracker_voice_gemini_live_provider.sql
          after_p0_digest="$(protected_digest)"
          test "$before_p0_digest" = "$after_p0_digest"
          echo "TRACKER_VOICE_P0_CATALOG_UNCHANGED=PASS"
          echo "TRACKER_VOICE_12008_APPLY=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000002_floor_table_control_v3_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000010_floor_table_control_v3_final_live_bridge.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000011_floor_table_control_v3_final_contract.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000012_floor_table_control_v3_production_enable.sql
          echo "TRACKER_VOICE_FLOOR_V3_PREREQUISITES=PASS"
          createdb tracker_voice_v0_before_13000007 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000007_tracker_voice_transcribe35_binding.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT position('gemini-3.5-transcribe-live' IN pg_get_functiondef(
              'public._tracker_voice_register_validated_event(uuid,uuid,uuid,uuid,text,text,text,numeric,text,jsonb,text,text,text,text,text,boolean,text)'::regprocedure
            )) > 0
            AND position('p_provider_model <> v_config.provider_model' IN pg_get_functiondef(
              'public._tracker_voice_register_validated_event(uuid,uuid,uuid,uuid,text,text,text,numeric,text,jsonb,text,text,text,text,text,boolean,text)'::regprocedure
            )) > 0")" = "t"
          echo "TRACKER_VOICE_13000007_APPLY=PASS"
          createdb tracker_voice_v0_before_13000009 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270113000009_tracker_voice_board_atomic_commit_v0.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public.commit_tracker_voice_board_v0(uuid,text,text)') IS NOT NULL
                    AND to_regprocedure('public._tracker_voice_register_validated_board_event(uuid,uuid,uuid,uuid,text,text,text,text,jsonb,text,text,text,text)') IS NOT NULL
                    AND to_regprocedure('public._tracker_update_community_cards_core(uuid,jsonb,uuid,integer,jsonb)') IS NULL")" = "t"
          echo "TRACKER_VOICE_13000009_APPLY=PASS"
          createdb tracker_voice_v0_before_14000001 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000001_tracker_voice_hole_cards_atomic_confirm_v0.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT position('v_service_voice_call' IN pg_get_functiondef(
                      'public.show_hole_cards(uuid,jsonb,uuid)'::regprocedure
                    )) > 0
                    AND to_regprocedure('public.commit_tracker_voice_hole_cards_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,integer,jsonb)') IS NOT NULL
                    AND NOT has_function_privilege('authenticated', 'public.commit_tracker_voice_hole_cards_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,integer,jsonb)', 'EXECUTE')")" = "t"
          echo "TRACKER_VOICE_14000001_APPLY=PASS"
          createdb tracker_voice_v0_before_14000002 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000002_tracker_voice_finish_atomic_commit_v0.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public.commit_tracker_voice_finish_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)') IS NOT NULL
                    AND position('v_service_voice_call' IN pg_get_functiondef(
                      'public.record_hand(uuid,uuid,integer,timestamp with time zone,jsonb,jsonb,jsonb,jsonb,integer,uuid)'::regprocedure
                    )) > 0
                    AND NOT has_function_privilege('authenticated', 'public.commit_tracker_voice_finish_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE')")" = "t"
          echo "TRACKER_VOICE_14000002_APPLY=PASS"
          createdb tracker_voice_v0_before_14000003 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000003_tracker_voice_snake_case_canonical_hash_v2.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public._tracker_voice_canonical_json_v2(jsonb)') IS NOT NULL
                    AND to_regprocedure('public._tracker_voice_sha256_jsonb_v2(jsonb)') IS NOT NULL
                    AND position('_tracker_unified_ops_request_hash_v2' IN pg_get_functiondef(
                      'public._tracker_voice_request_hash(jsonb)'::regprocedure
                    )) = 0")" = "t"
          echo "TRACKER_VOICE_14000003_APPLY=PASS"
          createdb tracker_voice_v0_before_14000004 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000004_tracker_voice_floor_mode_global_rollout.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT EXISTS (SELECT 1 FROM public.app_settings WHERE key = 'tracker_voice_global_enabled' AND value = 'false'::jsonb)
                    AND EXISTS (SELECT 1 FROM public.app_settings WHERE key = 'tracker_voice_auto_provision_enabled' AND value = 'false'::jsonb)
                    AND to_regprocedure('public.reconcile_tracker_voice_floor_configs()') IS NOT NULL
                    AND to_regprocedure('floor_private.sync_tracker_voice_config(uuid,boolean)') IS NOT NULL")" = "t"
          echo "TRACKER_VOICE_14000004_APPLY=PASS"
          createdb tracker_voice_v0_before_14000009 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000009_tracker_voice_provider_event_idempotency.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT position('provider_event_mismatch' IN pg_get_functiondef(
              'public._tracker_voice_register_validated_event(uuid,uuid,uuid,uuid,text,text,text,numeric,text,jsonb,text,text,text,text,text,boolean,text)'::regprocedure
            )) > 0")" = "t"
          echo "TRACKER_VOICE_14000009_APPLY=PASS"
          createdb tracker_voice_v0_before_14000010 -T tracker_voice_v0
          createdb tracker_voice_v0_14000010_crlf -T tracker_voice_v0_before_14000010
          crlf_migration="$RUNNER_TEMP/tracker-voice-14000010-crlf.sql"
          sed 's/$/\r/' \
            supabase/migrations/20270114000010_tracker_voice_covering_stack_hole_cards.sql \
            > "$crlf_migration"
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0_14000010_crlf \
            -f "$crlf_migration"
          test "$(psql -X -At -d tracker_voice_v0_14000010_crlf -c \
            "SELECT position('_tracker_voice_runout_reveal_authoritative_v1' IN pg_get_functiondef(
              'public.commit_tracker_voice_hole_cards_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,integer,jsonb)'::regprocedure
            )) > 0")" = "t"
          echo "TRACKER_VOICE_14000010_CRLF_APPLY=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270114000010_tracker_voice_covering_stack_hole_cards.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public._tracker_voice_runout_reveal_authoritative_v1(uuid)') IS NOT NULL
                    AND position('_tracker_voice_runout_reveal_authoritative_v1' IN pg_get_functiondef(
                      'public.commit_tracker_voice_hole_cards_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,integer,jsonb)'::regprocedure
                    )) > 0
                    AND NOT has_function_privilege('authenticated', 'public.commit_tracker_voice_hole_cards_v0(uuid,uuid,uuid,uuid,text,text,text,text,text,text,integer,jsonb)', 'EXECUTE')")" = "t"
          echo "TRACKER_VOICE_14000010_APPLY=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f tests/trackerVoice/currentP0VoiceChain.integration.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_voice_v0 \
            -f supabase/migrations/20270115000005_tracker_dealer_floor_operational_alerts.sql
          test "$(psql -X -At -d tracker_voice_v0 -c \
            "SELECT to_regprocedure('public.report_tracker_floor_operational_alert(uuid,uuid,uuid,uuid,text,text,uuid)') IS NOT NULL
                    AND to_regprocedure('public.list_tracker_floor_alerts(uuid,text)') IS NOT NULL
                    AND has_function_privilege('authenticated', 'public.report_tracker_floor_operational_alert(uuid,uuid,uuid,uuid,text,text,uuid)', 'EXECUTE')
                    AND NOT has_function_privilege('anon', 'public.report_tracker_floor_operational_alert(uuid,uuid,uuid,uuid,text,text,uuid)', 'EXECUTE')
                    AND (public.report_tracker_floor_operational_alert(NULL,NULL,NULL,NULL,'call_floor',NULL,NULL)->>'error') = 'invalid_request'")" = "t"
          echo "TRACKER_FLOOR_OPERATIONAL_ALERTS_15000005_APPLY=PASS"
          createdb tracker_correction_release1 -T tracker_voice_v0
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migrations/20270115000013_tracker_correction_capability_disabled.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migrations/20270115000014_tracker_floor_alert_action_reference.sql
          test "$(psql -X -At -d tracker_correction_release1 -c \
            "SELECT to_regprocedure('public.report_tracker_floor_operational_alert_v2(uuid,uuid,uuid,uuid,text,text,uuid,jsonb,bigint)') IS NOT NULL
                    AND has_function_privilege('authenticated', 'public.report_tracker_floor_operational_alert_v2(uuid,uuid,uuid,uuid,text,text,uuid,jsonb,bigint)', 'EXECUTE')
                    AND NOT has_function_privilege('anon', 'public.report_tracker_floor_operational_alert_v2(uuid,uuid,uuid,uuid,text,text,uuid,jsonb,bigint)', 'EXECUTE')")" = "t"
          echo "TRACKER_FLOOR_ACTION_REFERENCE_15000012_APPLY=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f tests/trackerCorrectionRelease1/actionReference.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migrations/20270115000016_tracker_correction_uat_release2.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f tests/trackerCorrectionRelease2/release2.pg17.sql
          echo "TRACKER_CORRECTION_RELEASE2_15000016_APPLY=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 <<'SQL'
          CREATE OR REPLACE FUNCTION public.is_club_owner(p_user_id uuid, p_club_id uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public
          AS $$ SELECT public.has_role(p_user_id, 'super_admin'::public.app_role)
            OR EXISTS (SELECT 1 FROM public.clubs c WHERE c.id = p_club_id AND c.owner_id = p_user_id) $$;
          CREATE OR REPLACE FUNCTION public.is_club_admin(p_user_id uuid, p_club_id uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public
          AS $$ SELECT EXISTS (SELECT 1 FROM public.clubs c WHERE c.id = p_club_id AND c.owner_id = p_user_id) $$;
          SQL
          createdb tracker_correction_s1 -T tracker_correction_release1
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_s1 \
            -f supabase/migrations/20270128000005_tracker_correction_floor_tracker_authority.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_s1 \
            -f tests/trackerCorrectionRelease2/floorTrackerAuthority.pg17.sql
          echo "TRACKER_CORRECTION_FLOOR_TRACKER_AUTHORITY_28000005=PASS"
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migrations/20261238000002_tracker_settlement_outcome_store.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migrations/20270115000001_tracker_blind_position_lineage.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_correction_release1 \
            -f supabase/migration-archive/historical-never-replay/20270115000002_tracker_hand_correction_commit_receipt.sql
