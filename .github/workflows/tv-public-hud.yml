name: TV broadcast and public player HUD
on:
  pull_request:
    paths:
      - 'VinPoker/src/components/tv/**'
      - 'VinPoker/src/components/tracker/PublicPlayerHud*'
      - 'VinPoker/src/components/tracker/PlayerHandHistory*'
      - 'VinPoker/src/components/cashier/tournament-live/HandSelector*'
      - 'VinPoker/src/components/cashier/tournament-live/viewer-hub/RealtimeTablesGrid*'
      - 'VinPoker/src/components/cashier/tournament-live/viewer-hub/SpectatorMiniTable*'
      - 'VinPoker/src/components/cashier/tournament-live/viewer-hub/LiveHub*'
      - 'VinPoker/src/pages/TournamentLiveTracker.tsx'
      - 'VinPoker/tests/viewerHub/liveHub.render.test.tsx'
      - 'VinPoker/src/lib/publicPlayerHud*'
      - 'VinPoker/src/hooks/useTvStackRange*'
      - 'VinPoker/supabase/functions/public-player-hud/**'
      - 'VinPoker/tests/publicHud/**'
      - '.github/workflows/tv-public-hud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-public-hud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VinPoker
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-build-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - run: VERCEL=1 npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/public-player-hud/index.ts
      - run: npx vitest run tests/publicHud/metrics.test.ts tests/publicHud/handler.test.ts src/lib/publicPlayerHud.test.ts src/hooks/useTvStackRange.test.ts src/components/tracker/PublicPlayerHud.test.tsx src/components/tracker/PlayerHandHistory.test.tsx src/components/cashier/tournament-live/HandSelector.test.tsx src/components/tv/TvBroadcastBoard.test.tsx src/lib/tv/mapTvData.test.ts src/lib/tv/mapDisplayState.test.ts src/components/cashier/tournament-live/viewer-hub/SpectatorMiniTable.test.tsx src/components/cashier/tournament-live/viewer-hub/RealtimeTablesGrid.test.tsx --maxWorkers=1 --no-file-parallelism
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run tests/viewerHub/liveHub.render.test.tsx tests/viewerHub/tournamentLiveViewInitialization.test.tsx src/components/cashier/tournament-live/viewer-hub/LiveHub.navigation.test.tsx --maxWorkers=1 --no-file-parallelism
      - run: npm run build
