name: Staff FT payment isolated DB
on:
  pull_request:
    paths:
      - '.github/workflows/staff-ft-payment-db.yml'
      - 'VinPoker/tests/staffSalary/l02Payment.*'
      - 'VinPoker/supabase/pending-migrations/20261126131948_staff_ft_payment_intent_v1.sql'
      - 'VinPoker/supabase/pending-migrations/20261126135235_staff_salary_payment_report_v1.sql'
      - 'VinPoker/supabase/pending-migrations/20261126144343_staff_salary_closed_shift_adjustments_v1.sql'
      - 'VinPoker/supabase/pending-migrations/20261126151950_staff_salary_supplement_requests_v1.sql'
      - 'VinPoker/supabase/pending-migrations/20261126162754_staff_salary_supplement_self_reader_v1.sql'
permissions:
  actions: read
  contents: read
jobs:
  staff-ft-payment-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_l02
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d vinpoker_ops_l02"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_l02
      CAPTURE_RUN: '44484017071'
      CAPTURE_SHA: '02c4d6cba8678c9d52feea055fc1f0714082bc77'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify capture provenance and restore schema on loopback
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/l02-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER"             '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and
             .event == "workflow_dispatch" and .actor.login == $owner and
             .path == ".github/workflows/capture-live-public-schema.yml"'             "$RUNNER_TEMP/l02-capture.json" > /dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/l02-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Apply only the reviewed FT intent candidate to the isolated database
        working-directory: VinPoker
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = vinpoker_ops_l02
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/pending-migrations/20261126131948_staff_ft_payment_intent_v1.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/pending-migrations/20261126135235_staff_salary_payment_report_v1.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/pending-migrations/20261126144343_staff_salary_closed_shift_adjustments_v1.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/pending-migrations/20261126151950_staff_salary_supplement_requests_v1.sql
      - name: Race and replay approved FT payments as authenticated staff
        working-directory: VinPoker
        run: bash tests/staffSalary/l02Payment.concurrent.sh
