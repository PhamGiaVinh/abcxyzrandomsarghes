name: HUD 346 protected migration

on:
  pull_request:
    paths:
      - .github/workflows/hud-346-protected-apply.yml
      - VinPoker/scripts/ops/hud-346-protected-apply*.mjs
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Successful encrypted backup and isolated restore run
        required: true
        type: string
      confirmation:
        description: APPLY_HUD_346 followed by the exact source SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: vinpoker-production-database-release
  cancel-in-progress: false

env:
  RELEASE_SHA: e3c2640fdb6e20f3f1e180c476721424e23224e3

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: runner}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.RELEASE_SHA }}', path: release}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Verify exact migration and atomic wrapper
        working-directory: runner/VinPoker
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release/VinPoker
        run: |
          node scripts/ops/hud-346-protected-apply.mjs verify-source
          node --test scripts/ops/hud-346-protected-apply.test.mjs
      - name: Verify protected dispatch and source checks
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_HUD_346: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRM_HUD_346" = "APPLY_HUD_346_$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/environments/dealer-swing-production-critical" |
            jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/pulls/1728" |
            jq -e --arg sha "$RELEASE_SHA" '.state=="open" and .base.ref=="main" and .head.sha==$sha' >/dev/null
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          for name in postgres collision-guard release-runner-postgres-17 'Floor V3 catalog and promotion preflight'; do
            jq -e --arg name "$name" '[.check_runs[] | select(.name==$name and .app.slug=="github-actions")] | max_by(.id) | .conclusion=="success"' <<<"$checks" >/dev/null
          done
  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: dealer-swing-production-critical
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: runner}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.RELEASE_SHA }}', path: release}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Verify backup run and download only the restore receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/1728" |
            jq -e --arg sha "$RELEASE_SHA" '.state=="open" and .base.ref=="main" and .head.sha==$sha' >/dev/null
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/floor-v3-recovery-backup.yml" --jq .id)"
          jq -e --argjson workflow "$workflow" --arg owner "$GITHUB_REPOSITORY_OWNER" '
            .workflow_id==$workflow and .event=="workflow_dispatch" and .status=="completed" and
            .conclusion=="success" and .head_branch=="main" and
            .actor.login==$owner and .triggering_actor.login==$owner' <<<"$run" >/dev/null
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts" |
            jq -ce --arg name "floor-v3-restore-verification-$RECOVERY_RUN_ID" '
              [.artifacts[]|select(.name==$name and .expired==false and .size_in_bytes>0)] |
              if length==1 then .[0] else error("restore artifact missing") end')"
          id="$(jq -r .id <<<"$artifact")"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$artifact")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$RUNNER_TEMP/hud346-recovery.zip"
          test "$(sha256sum "$RUNNER_TEMP/hud346-recovery.zip" | cut -d ' ' -f1)" = "${digest#sha256:}"
          test "$(unzip -Z1 "$RUNNER_TEMP/hud346-recovery.zip")" = recovery-verification.json
          unzip -p "$RUNNER_TEMP/hud346-recovery.zip" recovery-verification.json >"$RUNNER_TEMP/hud346-recovery.json"
          printf 'RECOVERY_BASE_SHA=%s\n' "$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' <<<"$run")" >>"$GITHUB_ENV"
          printf 'RECOVERY_RECEIPT_PATH=%s/hud346-recovery.json\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"
      - name: Apply only HUD 346 and verify receipt and definitions
        working-directory: runner/VinPoker
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release/VinPoker
          SOURCE_CHECKOUT_SHA: ${{ env.RELEASE_SHA }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONFIRM_HUD_346: ${{ inputs.confirmation }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.orlesggcjamwuknxwcpk
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/ops/hud-346-protected-apply.mjs apply
