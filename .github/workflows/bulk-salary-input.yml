name: Bulk salary input
on:
  pull_request:
    paths:
      - 'VinPoker/src/components/cashier/BulkSalaryDialog*'
      - '.github/workflows/bulk-salary-input.yml'
permissions:
  contents: read
jobs:
  bulk-salary-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VinPoker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- src/components/cashier/BulkSalaryDialog.input.test.tsx
