name: Ops V3 Tracker Dealer read-only

on:
  pull_request:
    paths:
      - ".github/workflows/ops-v3-tracker-dealer.yml"
      - "VinPoker/src/OpsApp.tsx"
      - "VinPoker/src/ops/auth/OpsAuthProvider*"
      - "VinPoker/src/ops/auth/OpsCapabilityProvider*"
      - "VinPoker/src/ops/auth/opsSessionValidation*"
      - "VinPoker/src/ops/coverage/trackerDealerButtonManifest.ts"
      - "VinPoker/src/ops/dealer-control/**"
      - "VinPoker/src/ops/registry/opsModuleRegistry.ts"
      - "VinPoker/src/ops/tracker/**"
      - "VinPoker/scripts/security/check-ops-v3-shell-text.mjs"
      - "VinPoker/e2e/ops-v3-tracker-dealer.mock.spec.ts"
      - "VinPoker/tests/opsTrackerDealer/**"
      - "VinPoker/src/components/cashier/tournament-live/TournamentLiveView.tsx"
      - "VinPoker/src/components/cashier/tournament-live/ClockPanel*"
      - "VinPoker/src/components/LiveStateEditor*"
      - "VinPoker/src/lib/tournament/clockControlState*"
      - "VinPoker/src/i18n/locales/**"
      - "VinPoker/tests/viewerHub/tournamentLiveViewBlindContext.test.tsx"
      - "VinPoker/tests/viewerHub/tournamentLiveViewInitialization.test.tsx"
      - "VinPoker/src/pages/TrackerDashboard.tsx"
      - "VinPoker/src/pages/DealerSwingDashboard*"
      - "VinPoker/src/pages/TrackerDashboard.test.tsx"
      - "VinPoker/src/pages/TrackerHandHistory.tsx"
      - "VinPoker/src/pages/TrackerHandHistory.readiness.test.tsx"
      - "VinPoker/src/hooks/useNotifications.tsx"
      - "VinPoker/src/hooks/useNotifications.test.tsx"
      - "VinPoker/src/components/NotificationBell.tsx"
      - "VinPoker/src/components/NotificationBell.test.tsx"
      - "VinPoker/src/pages/Notifications.tsx"
      - "VinPoker/src/hooks/useDealerSwing.ts"
      - "VinPoker/src/hooks/useDealerSwing.readScope.test.tsx"
      - "VinPoker/src/components/cashier/DealerSwingTab.tsx"
      - "VinPoker/src/components/cashier/DealerSwingTab.readState.test.tsx"
      - "VinPoker/src/components/cashier/dealer-swing/DealerSwingStopControl*"
      - "VinPoker/src/components/cashier/dealer-swing/DealerSwingSummaryStrip*"
      - "VinPoker/src/components/cashier/command-center/AttentionQueue*"
      - "VinPoker/src/components/cashier/dealer-swing/DealerCheckinCandidateList*"
      - "VinPoker/src/components/cashier/tournament-live/handinput/useStandaloneHandInput.ts"
      - "VinPoker/src/components/cashier/tournament-live/handinput/RacetrackHandInputConsole.tsx"
      - "VinPoker/src/components/cashier/tournament-live/handinput/SetupHandPanel*"
      - "VinPoker/tests/trackerSettlement/startHandCapability.repro.mjs"
      - "VinPoker/src/components/cashier/tournament-live/RegistrationQueuePanel*"
      - "VinPoker/tests/floorTableControlV3/registrationQueueRead.repro.mjs"
      - "VinPoker/src/lib/dealerCheckinCandidates*"
      - "VinPoker/tests/dealerSwing/checkinReactLifecycle.test.tsx"
      - "VinPoker/src/pages/ops/OpsToday*"
      - "VinPoker/src/pages/ops/OpsDealerSwing*"
      - "VinPoker/src/pages/ops/OpsTournamentCockpit*"
      - "VinPoker/tests/floorProduction/createdTournamentSelection.render.test.tsx"
      - "VinPoker/src/components/cashier/TournamentLivePanel*"
      - "VinPoker/src/hooks/useTournamentParticipationSummary*"
      - "VinPoker/src/lib/tournamentParticipation*"
      - "VinPoker/src/components/chip-ops/DashboardTab*"
      - "VinPoker/src/lib/chipOpsMetrics*"
      - "VinPoker/scripts/ops/tracker-history-canary-transport*"
      - ".github/workflows/tracker-history-scoped-http-canary.yml"
      - ".github/workflows/tracker-history-owned-cleanup.yml"
      - "VinPoker/tsconfig.ops-v3-tracker-dealer.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-dealer-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Run Ops security and text guards
        working-directory: VinPoker
        run: |
          npm run check:ops-boundary
          npm run check:ops-money-boundary
          npm run check:ops-v3-shell-text
          npm run check:credential-context
          git diff --check

      - name: Run Tracker and Dealer Control contracts
        working-directory: VinPoker
        run: >-
          npx vitest run
          tests/opsTrackerDealer/opsTrackerDealer.contract.test.ts
          src/ops/registry/opsModuleRegistry.test.ts
          src/ops/auth/OpsAuthProvider.test.tsx
          src/ops/auth/OpsCapabilityProvider.refocus.test.tsx
          src/ops/auth/opsSessionValidation.test.ts
          src/pages/ops/TourCashierWorkbenchShift.test.tsx
          tests/viewerHub/tournamentLiveViewBlindContext.test.tsx
          tests/viewerHub/tournamentLiveViewInitialization.test.tsx
          src/components/cashier/tournament-live/ClockPanel.readScope.test.tsx
          src/lib/tournament/clockControlState.test.ts
          src/pages/ops/OpsTournamentCockpit.clockScope.test.tsx
          src/pages/TrackerDashboard.test.tsx
          src/pages/TrackerHandHistory.readiness.test.tsx
          tests/trackerPoker/trackerHistoryAccess.test.ts
          src/hooks/useNotifications.test.tsx
          src/components/NotificationBell.test.tsx
          src/hooks/useDealerSwing.readScope.test.tsx
          src/components/cashier/DealerSwingTab.readState.test.tsx
          src/pages/DealerSwingDashboard.scope.test.tsx
          src/components/cashier/shift-planner-v2/__tests__/ShiftPlannerV2Tab.smoke.test.tsx
          src/components/cashier/shift-planner/__tests__/ShiftPlannerTab.smoke.test.tsx
          src/components/cashier/dealer-swing/DealerSwingStopControl.test.tsx
          src/components/cashier/command-center/AttentionQueue.test.tsx
          src/components/cashier/dealer-swing/DealerCheckinCandidateList.test.tsx
          src/lib/dealerCheckinCandidates.test.ts
          tests/dealerSwing/checkinReactLifecycle.test.tsx
          src/pages/ops/OpsToday.readState.test.tsx
          src/pages/ops/OpsDealerSwing.readState.test.tsx
          src/components/cashier/tournament-live/ClockPanel.tsx
          src/components/cashier/tournament-live/ClockPanel.readScope.test.tsx
          tests/floorProduction/createdTournamentSelection.render.test.tsx
          src/components/cashier/TournamentLivePanel.summary.test.tsx
          src/hooks/useTournamentParticipationSummary.test.tsx
          src/components/LiveStateEditor.test.tsx
          src/lib/tournamentParticipation.test.ts
          src/hooks/useTournamentTvDataCore.test.tsx
          src/components/cashier/tournament-live/handinput/useStandaloneRosterIntent.test.tsx
          src/components/cashier/tournament-live/handinput/SetupHandPanel.startCapability.test.tsx
          src/components/cashier/tournament-live/RegistrationQueuePanel.readState.test.tsx
          src/components/tracker/DealerTabletCockpit.test.tsx
          src/components/chip-ops/DashboardTab.test.tsx
          src/lib/chipOpsMetrics.test.ts
          --maxWorkers=1 --minWorkers=1

      - name: Test bounded History canary release transport
        working-directory: VinPoker
        run: node --test scripts/ops/tracker-history-canary-transport.test.mjs

      - name: Test actual start-hand capability handler and reader
        working-directory: VinPoker
        run: node --test tests/trackerSettlement/startHandCapability.repro.mjs

      - name: Test actual registration queue partial-read failures
        working-directory: VinPoker
        run: node --test tests/floorTableControlV3/registrationQueueRead.repro.mjs

      - name: Lint targeted read-only source and tests
        working-directory: VinPoker
        run: >-
          npx eslint
          src/OpsApp.tsx
          src/ops/auth/OpsAuthProvider.tsx
          src/ops/auth/OpsAuthProvider.test.tsx
          src/ops/auth/OpsCapabilityProvider.tsx
          src/ops/auth/OpsCapabilityProvider.refocus.test.tsx
          src/components/LiveStateEditor.tsx
          src/components/LiveStateEditor.test.tsx
          src/pages/TrackerHandHistory.tsx
          src/pages/TrackerHandHistory.readiness.test.tsx
          src/ops/coverage/trackerDealerButtonManifest.ts
          src/ops/dealer-control
          src/ops/registry/opsModuleRegistry.ts
          src/ops/tracker
          scripts/security/check-ops-v3-shell-text.mjs
          e2e/ops-v3-tracker-dealer.mock.spec.ts
          tests/opsTrackerDealer
          src/hooks/useNotifications.tsx
          src/hooks/useNotifications.test.tsx
          src/components/NotificationBell.tsx
          src/components/NotificationBell.test.tsx
          src/pages/Notifications.tsx
          src/pages/ops/OpsTournamentCockpit.tsx
          src/pages/ops/OpsTournamentCockpit.clockScope.test.tsx
          src/components/cashier/dealer-swing/DealerSwingStopControl.tsx
          src/components/cashier/dealer-swing/DealerCheckinCandidateList.tsx
          src/components/cashier/dealer-swing/DealerCheckinCandidateList.test.tsx
          src/lib/dealerCheckinCandidates.ts
          src/lib/dealerCheckinCandidates.test.ts
          src/components/cashier/dealer-swing/DealerSwingStopControl.test.tsx
          src/hooks/useDealerSwing.readScope.test.tsx
          src/components/cashier/DealerSwingTab.readState.test.tsx
          src/pages/DealerSwingDashboard.tsx
          src/pages/DealerSwingDashboard.scope.test.tsx
          src/pages/ops/OpsToday.readState.test.tsx
          src/pages/ops/OpsDealerSwing.readState.test.tsx

      # The legacy Floor/SuperAdmin summary is outside the targeted ops config.
      - name: Type-check complete application
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc -b

      - name: Type-check Tracker and Dealer Control workspaces
        working-directory: VinPoker
        run: npx tsc -p tsconfig.ops-v3-tracker-dealer.json --pretty false

      - name: Build production source
        working-directory: VinPoker
        run: npm run build

      - name: Install Chromium for responsive mock-session verification
        working-directory: VinPoker
        run: npx playwright install --with-deps chromium

      - name: Run responsive exact-club read-only verification
        working-directory: VinPoker
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-publishable-key
        run: npx playwright test e2e/ops-v3-tracker-dealer.mock.spec.ts --workers=1
