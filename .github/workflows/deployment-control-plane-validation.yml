      - "VinPoker/scripts/payroll/apply-dealer-payroll-statement-contract.mjs"
      - "VinPoker/scripts/payroll/apply-dealer-payroll-statement-contract.test.mjs"
      - "VinPoker/scripts/ops/apply-sepay-scope-q0.mjs"
      - "VinPoker/scripts/ops/apply-sepay-scope-q0.test.mjs"
      - "VinPoker/scripts/ops/sepay-scope-q0-policy.mjs"
      - "VinPoker/supabase/pending-migrations/20270114000000_ops_quant_data_health_q0.sql"
      - "VinPoker/scripts/payroll/repair-dealer-payroll-statement-delivery.mjs"
      - "VinPoker/scripts/payroll/repair-dealer-payroll-statement-delivery.test.mjs"
      - "VinPoker/scripts/payroll/set-dealer-payroll-statement-delivery-hsop-uat.mjs"
      - "VinPoker/scripts/payroll/set-dealer-payroll-statement-delivery-hsop-uat.test.mjs"
      - "VinPoker/supabase/pending-migrations/20270113000008_dealer_payroll_statement_telegram_delivery_contract_repair.sql"
      - "VinPoker/docs/dealer-swing/CONTROL_PLANE_RUNBOOK.md"
      - "VinPoker/docs/dealer-swing/SHORTAGE_ALERT_ROLLOUT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Pinned actionlint on exact source revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision under validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download and verify actionlint 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.7_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate exact workflow revision
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" \
            .github/workflows/vbackerworkflowmain.yml \
            .github/workflows/floor-clock-control-apply.yml \
            .github/workflows/floor-operator-scope-acl-apply.yml \
            .github/workflows/dealer-stop-64-protected-apply.yml \
            .github/workflows/dealer-shortage-alert-lifecycle-apply.yml \
            .github/workflows/dealer-swing-phone-completion-apply.yml \
            .github/workflows/dealer-swing-phone-hsop-uat.yml \
            .github/workflows/dealer-swing-dark-monitor.yml \
            .github/workflows/capture-live-public-schema.yml \
            .github/workflows/dealer-pt-wage-disposable-validation.yml \
            .github/workflows/dealer-pt-wage-global-continuous-accrual-apply.yml \
            .github/workflows/dealer-pt-wage-readiness-acl-apply.yml \
            .github/workflows/dealer-payroll-statement-contract-apply.yml \
            .github/workflows/ops-sepay-scope-q0-apply.yml \
            .github/workflows/dealer-payroll-statement-hsop-uat.yml \
            .github/workflows/dealer-payroll-statement-delivery-hsop-uat.yml \
            .github/workflows/dealer-payroll-statement-delivery-repair-hsop.yml \
            .github/workflows/deployment-control-plane-validation.yml \
            .github/workflows/physical-asset-63-65-protected-apply.yml

      - name: Actionlint staged Tracker DB release workflows
        shell: bash
        run: '"${RUNNER_TEMP}/actionlint" .github/workflows/tracker-manual-75-protected-apply.yml .github/workflows/tracker-reads-76-77-protected-apply.yml'

      - name: Setup Node.js 20 for Floor runner tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Test exact asset63+65 release transport
        run: node --test VinPoker/scripts/ops/physical-asset-63-65-release-plan.test.mjs VinPoker/scripts/ops/physical-asset-63-65-protected-apply.test.mjs

      - name: Test pinned dump image transport without production access
        run: node --test VinPoker/scripts/deploy/preload-postgres-dump-image.test.mjs

      - name: Verify actual pinned mirror image and pg_dump binary without production access
        working-directory: VinPoker
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { VERSION, TARGET, preload } from './scripts/deploy/preload-postgres-dump-image.mjs';
          preload(VERSION);
          const result = spawnSync('docker', ['run', '--rm', '--entrypoint', 'pg_dump', TARGET, '--version'], { encoding: 'utf8', timeout: 60000 });
          assert.equal(result.status, 0, 'Pinned pg_dump failed to execute');
          assert.match(result.stdout, /pg_dump \(PostgreSQL\) 17\./);
          console.log('PINNED_MIRROR_PG17_BINARY_RUNTIME_PASS_NO_PRODUCTION_ACCESS');
          NODE

      - name: Test exact production apply runners
        run: node --test VinPoker/scripts/floor/apply-floor-clock-control.test.mjs VinPoker/scripts/floor/apply-floor-operator-scope-acl.test.mjs VinPoker/scripts/dealer-swing/apply-shortage-alert-lifecycle.test.mjs VinPoker/scripts/dealer-swing/apply-phone-completion-migrations.test.mjs VinPoker/scripts/dealer-swing/set-phone-completion-hsop-uat.test.mjs VinPoker/scripts/payroll/apply-dealer-pt-global-accrual.test.mjs VinPoker/scripts/payroll/apply-dealer-pt-wage-readiness-acl.test.mjs VinPoker/scripts/payroll/apply-dealer-payroll-statement-contract.test.mjs VinPoker/scripts/payroll/repair-dealer-payroll-statement-delivery.test.mjs VinPoker/scripts/payroll/set-dealer-payroll-statement-delivery-hsop-uat.test.mjs VinPoker/scripts/deploy/validate-live-public-schema-artifact.test.mjs VinPoker/scripts/deploy/workflow-policy.test.mjs VinPoker/scripts/deploy/test-dealer-pt-wage-disposable.test.mjs VinPoker/scripts/deploy/verify-dealer-pt-wage-migration-inventory.test.mjs VinPoker/scripts/ops/apply-sepay-scope-q0.test.mjs
      - name: Test scoped Stop64 protected transport
        run: node --test VinPoker/scripts/ops/dealer-stop-64-release-plan.test.mjs VinPoker/scripts/ops/dealer-stop-64-protected-apply.test.mjs
      - name: Test exact manual75 protected transport
        run: node --test VinPoker/scripts/ops/tracker-manual-75-release-plan.test.mjs VinPoker/scripts/ops/tracker-manual-75-protected-apply.test.mjs
      - name: Test exact scoped reads76/77 protected transport
        run: node --test VinPoker/scripts/ops/tracker-reads-76-77-release-plan.test.mjs VinPoker/scripts/ops/tracker-reads-76-77-protected-apply.test.mjs
