      - ".github/workflows/capture-live-public-schema.yml"
      - ".github/workflows/dealer-pt-wage-disposable-validation.yml"
      - ".github/workflows/dealer-pt-wage-global-continuous-accrual-apply.yml"
      - ".github/workflows/dealer-pt-wage-readiness-acl-apply.yml"
      - ".github/workflows/dealer-payroll-statement-contract-apply.yml"
      - ".github/workflows/ops-sepay-scope-q0-apply.yml"
      - ".github/workflows/dealer-payroll-statement-delivery-repair-hsop.yml"
      - ".github/workflows/dealer-payroll-statement-delivery-hsop-uat.yml"
      - ".github/workflows/deployment-control-plane-validation.yml"
      - ".github/workflows/physical-asset-63-65-protected-apply.yml"
      - "VinPoker/scripts/ops/physical-asset-63-65-*"
      - "VinPoker/scripts/floor/apply-floor-clock-control.mjs"
      - "VinPoker/scripts/floor/apply-floor-clock-control.test.mjs"
      - "VinPoker/scripts/floor/apply-floor-operator-scope-acl.mjs"
      - "VinPoker/scripts/floor/apply-floor-operator-scope-acl.test.mjs"
      - "VinPoker/scripts/dealer-swing/shortage-alert-migration-policy.mjs"
      - "VinPoker/scripts/dealer-swing/apply-shortage-alert-lifecycle.mjs"
      - "VinPoker/scripts/dealer-swing/apply-shortage-alert-lifecycle.test.mjs"
      - "VinPoker/scripts/dealer-swing/phone-completion-migration-policy.mjs"
      - "VinPoker/scripts/dealer-swing/apply-phone-completion-migrations.mjs"
      - "VinPoker/scripts/dealer-swing/apply-phone-completion-migrations.test.mjs"
      - "VinPoker/scripts/dealer-swing/set-phone-completion-hsop-uat.mjs"
      - "VinPoker/scripts/dealer-swing/set-phone-completion-hsop-uat.test.mjs"
      - "VinPoker/scripts/dealer-swing/monitor-process-swing-dark.mjs"
      - "VinPoker/scripts/dealer-swing/monitor-process-swing-dark.test.mjs"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20270104000004_floor_clock_control_atomic.sql"
      - "VinPoker/supabase/migration-archive/historical-never-replay/20270104000005_floor_operator_scope_acl.sql"
      - "VinPoker/supabase/migration-archive/superseded/remote-alias/20270104000006_dealer_shortage_alert_lifecycle.sql"
      - "VinPoker/scripts/deploy/**"
      - "VinPoker/scripts/payroll/dealer-pt-global-accrual-migration-policy.mjs"
      - "VinPoker/scripts/payroll/apply-dealer-pt-global-accrual.mjs"
      - "VinPoker/scripts/payroll/apply-dealer-pt-global-accrual.test.mjs"
      - "VinPoker/scripts/payroll/dealer-pt-wage-readiness-acl-migration-policy.mjs"
      - "VinPoker/scripts/payroll/apply-dealer-pt-wage-readiness-acl.mjs"
