      - ".github/workflows/dealer-stop-64-protected-apply.yml"
      - ".github/workflows/tracker-voice-70-71-protected-apply.yml"
      - ".github/workflows/tracker-public-74-protected-apply.yml"
      - ".github/workflows/tracker-manual-75-protected-apply.yml"
      - ".github/workflows/tracker-reads-76-77-protected-apply.yml"
      - "VinPoker/scripts/ops/tracker-reads-76-77-*"
      - "VinPoker/scripts/ops/tracker-manual-75-*"
      - "VinPoker/scripts/ops/tracker-public-74-*"
