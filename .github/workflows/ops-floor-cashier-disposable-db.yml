name: Ops Floor Cashier disposable PostgreSQL 17

on:
  pull_request:
    paths:
      - ".github/workflows/ops-floor-cashier-disposable-db.yml"
      - ".github/workflows/ops-sepay-scope-q0-apply.yml"
      - "VinPoker/supabase/migrations/20270109000000_ops_floor_cashier_canonical_mutations.sql"
      - "VinPoker/src/ops/**"
      - "VinPoker/src/pages/ops/**"
      - "VinPoker/src/OpsApp.tsx"
      - "VinPoker/src/App.tsx"
      - "VinPoker/tests/gtoRetirement.source.test.mjs"
      - "VinPoker/e2e/gto-retirement.mock.spec.ts"
      - "VinPoker/src/components/ops/shared/**"
      - "VinPoker/src/components/cashier/tournament-live/OpenTableDialog.tsx"
      - "VinPoker/src/components/cashier/tournament-live/MovePlayerDialog.tsx"
      - "VinPoker/src/components/cashier/tournament-live/PlayerActionSheet*"
      - "VinPoker/src/components/admin/MediaClubSchedules*"
      - "VinPoker/src/lib/seriesReorder*"
      - "VinPoker/src/components/LegacyScheduleEvidenceNote*"
      - "VinPoker/src/pages/ClubDetail*"
      - "VinPoker/src/pages/Tournaments.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorTableMapPanelV3.tsx"
      - "VinPoker/src/lib/floorTableControlV3.ts"
      - "VinPoker/src/lib/floorPendingMoveIntent.ts"
      - "VinPoker/src/components/cashier/OfflineBuyInPanel.tsx"
      - "VinPoker/src/components/TournamentRegisterModal.test.tsx"
      - "VinPoker/src/components/floor/useFloorTournaments.ts"
      - "VinPoker/src/components/floor/useFloorTournaments*.test.tsx"
      - "VinPoker/src/components/floor/MultiDayTournamentsBoard*"
      - "VinPoker/src/hooks/useTournaments.ts"
      - "VinPoker/src/pages/SuperAdmin.tsx"
      - "VinPoker/src/pages/CashierDashboard.tsx"
      - "VinPoker/src/pages/CashierDashboard.tourEntry.test.tsx"
      - "VinPoker/e2e/ops-v3-floor-cashier.mock.spec.ts"
      - "VinPoker/e2e/cashier-tour-preview.mock.spec.ts"
      - "VinPoker/tsconfig.ops-v3-floor-cashier.json"
      - "VinPoker/tests/opsFloorCashier/**"
      - "VinPoker/tests/opsQuantDataHealthQ0/**"
      - "VinPoker/scripts/ops/apply-sepay-scope-q0.mjs"
      - "VinPoker/scripts/ops/apply-sepay-scope-q0.test.mjs"
      - "VinPoker/scripts/ops/sepay-scope-q0-policy.mjs"
      - "VinPoker/supabase/pending-migrations/20270114000000_ops_quant_data_health_q0.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-floor-cashier-disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Run Ops guards
        working-directory: VinPoker
        run: |
          npm run check:ops-boundary
          npm run check:ops-money-boundary
          npm run check:ops-v3-shell-text
          npm run check:credential-context
          git diff --check

      - name: Verify retired GTO is absent from normal application bootstrap
        working-directory: VinPoker
        run: node --test tests/gtoRetirement.source.test.mjs

      - name: Run targeted Ops mutation and UI tests
        working-directory: VinPoker
        run: >-
          npx vitest run
          src/ops/opsMutations.test.ts
          src/components/TournamentRegisterModal.test.tsx
          src/components/floor/useFloorTournaments.test.tsx
          src/components/floor/useFloorTournaments.readScope.test.tsx
          src/components/floor/MultiDayTournamentsBoard.test.tsx
          src/pages/CashierDashboard.tourEntry.test.tsx
          src/components/cashier/tournament-live/PlayerActionSheet.test.tsx
          src/components/admin/MediaClubSchedules.uploadOutcome.test.tsx
          src/components/admin/MediaClubSchedules.reorder.test.tsx
          src/lib/seriesReorder.test.ts
          src/components/LegacyScheduleEvidenceNote.test.tsx
          src/pages/ClubDetail.scheduleEvidence.test.tsx
          tests/opsFloorCashier

      - name: Run focused Quant Q0 source tests
        working-directory: VinPoker
        run: >-
          npx vitest run
          src/ops/intelligence/opsQuantDataHealthQ0.test.ts
          src/ops/intelligence/opsQuantDataHealthAdapter.test.ts
          src/ops/intelligence/opsQuantDataHealthArchitecture.test.ts

      - name: Lint targeted Ops source and tests
        working-directory: VinPoker
        run: >-
          npx eslint
          src/OpsApp.tsx
          src/components/TournamentRegisterModal.test.tsx
          src/pages/CashierDashboard.tourEntry.test.tsx
          src/components/ops/OpsShell.tsx
          src/components/cashier/tournament-live/OpenTableDialog.tsx
          src/components/ops/shared/FloorPlayerActions.tsx
          src/components/ops/shared/FloorSeatRoster.tsx
          src/components/ops/shared/FloorTableControlMode.tsx
          src/components/ops/shared/FloorTableModePicker.tsx
          src/components/ops/shared/FloorTableNumberPicker.tsx
          src/components/ops/shared/FloorTableRosterIndex.tsx
          src/components/ops/shared/PlayerActionSheets.tsx
          src/components/ops/shared/RoomGrid.tsx
          src/components/ops/shared/floorSeatEntryPreflight.ts
          src/components/ops/shared/useFloorSeats.ts
          src/ops/auth/OpsTournamentScopeGate.tsx
          src/ops/coverage/floorCashierButtonManifest.ts
          src/ops/floor/FloorTournamentWorkspace.tsx
          src/ops/floor/floorTournamentSections.ts
          src/ops/opsMutations.ts
          src/ops/workspace/TournamentOpsProvider.tsx
          src/pages/ops/OpsCashier.tsx
          src/pages/ops/OpsTables.tsx
          src/pages/ops/OpsTournamentCockpit.tsx
          src/pages/ops/OpsTournaments.tsx
          e2e/ops-v3-floor-cashier.mock.spec.ts
          e2e/cashier-tour-preview.mock.spec.ts
          tests/opsFloorCashier

      - name: Type-check canonical Ops mutation seam and tests
        working-directory: VinPoker
        run: npx tsc -p tsconfig.ops-floor-cashier.json --pretty false

      - name: Type-check unified Floor and Cashier workspaces
        working-directory: VinPoker
        run: npx tsc -p tsconfig.ops-v3-floor-cashier.json --pretty false

      - name: Type-check complete project references
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc -b --pretty false

      - name: Build production source (flags remain default-off)
        working-directory: VinPoker
        run: npm run build

      - name: Install Chromium for responsive mock-session verification
        working-directory: VinPoker
        run: npx playwright install --with-deps chromium

      - name: Run Floor and Cashier responsive mock-session verification
        working-directory: VinPoker
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-publishable-key
          VITE_FLOOR_TABLE_CONTROL_V3: preview
          VITE_FLOOR_UAT_ENV: preview
        run: npx playwright test e2e/ops-v3-floor-cashier.mock.spec.ts e2e/operations-responsive.mock.spec.ts e2e/operations-clock-payout.mock.spec.ts e2e/gto-retirement.mock.spec.ts --workers=1

      - name: Verify tour Cashier gate with mocked auth and money RPCs
        working-directory: VinPoker
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-publishable-key
          VITE_FLOOR_UAT_ENV: off
          VITE_OPS_TOUR_CASHIER: production
        run: npx playwright test e2e/cashier-tour-preview.mock.spec.ts --workers=1

      - name: Create isolated disposable fixture baseline
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/opsFloorCashier/disposableDb.fixture.sql

      - name: Apply exact Ops migration to disposable PostgreSQL only
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20270109000000_ops_floor_cashier_canonical_mutations.sql

      - name: Run PostgreSQL 17 runtime assertions
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/opsFloorCashier/disposableDb.integration.sql

      - name: Prove same-key concurrency converges to one business write
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/opsFloorCashier/concurrent.sql >/tmp/ops-concurrent-a.log 2>&1 &
          first=$!
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/opsFloorCashier/concurrent.sql >/tmp/ops-concurrent-b.log 2>&1 &
          second=$!
          wait "$first"
          wait "$second"
          result=$(psql -At -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.tournament_registrations r JOIN public.ops_cashier_mutation_idempotency i ON (i.response->>'registration_id')::uuid = r.id WHERE i.idempotency_key = 'atomic-concurrent';")
          test "$result" = "1"
          echo OPS_FLOOR_CASHIER_CONCURRENCY_PASS

      - name: Create Quant Q0 disposable database
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: createdb -h localhost -U postgres ops_quant_q0

      - name: Create Quant Q0 synthetic baseline
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d ops_quant_q0 -v ON_ERROR_STOP=1 -f tests/opsQuantDataHealthQ0/disposableDb.fixture.sql

      - name: Apply exact pending Quant Q0 source to disposable PostgreSQL only
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d ops_quant_q0 -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20270114000000_ops_quant_data_health_q0.sql

      - name: Run Quant Q0 PostgreSQL 17 authority assertions
        working-directory: VinPoker
        env:
          PGPASSWORD: ""
        run: psql -h localhost -U postgres -d ops_quant_q0 -v ON_ERROR_STOP=1 -f tests/opsQuantDataHealthQ0/disposableDb.integration.sql
