name: Free TEST finance repair component
on:
  pull_request:
    paths:
      - 'VinPoker/scripts/production/repairs/*free_felt_test_finance_20261124.sql'
      - 'VinPoker/tests/cashier/freeTestFinanceRepair.native.mjs'
      - 'VinPoker/tests/cashier/freeTestFinanceRepair.currentSchema.native.mjs'
      - '.github/workflows/finance-free-test-repair.yml'
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: finance_free_test_component
        ports: ['6543:5432']
        options: >-
          --health-cmd "pg_isready -d finance_free_test_component"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/cashier/freeTestFinanceRepair.native.mjs
        working-directory: VinPoker
      - run: git diff --check
