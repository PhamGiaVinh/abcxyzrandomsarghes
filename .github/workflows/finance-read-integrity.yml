name: Finance read integrity
on:
  pull_request:
    paths:
      - 'VinPoker/src/hooks/useClubFinanceSummary*'
      - 'VinPoker/src/hooks/accountant/useFinanceSummaryRpcOnly*'
      - 'VinPoker/src/lib/financeSummaryRead*'
      - 'VinPoker/src/lib/sessionReadEpoch.ts'
      - 'VinPoker/src/components/cashier/RevenueReportTab*'
      - 'VinPoker/src/components/accountant/AccountantFinanceTab.tsx'
      - 'VinPoker/src/components/accountant/AccountantFinanceTab.readIntegrity.test.tsx'
      - 'VinPoker/src/components/Layout.tsx'
      - 'VinPoker/src/components/Layout.unread.test.tsx'
      - 'VinPoker/src/App.tsx'
      - 'VinPoker/src/lib/financeNavigation*'
      - 'VinPoker/src/lib/financePayrollPeriod*'
      - 'VinPoker/src/pages/StaffSalaryChot*'
      - 'VinPoker/src/components/cashier/DealerPayrollTab*'
      - 'VinPoker/src/hooks/staffSalary/useSalaryActions.test.tsx'
      - 'VinPoker/src/pages/AccountantDashboard*'
      - 'VinPoker/src/pages/CashierDashboard*'
      - 'VinPoker/src/pages/ClubExpenses*'
      - 'VinPoker/src/pages/FinanceLegacyRedirect*'
      - 'VinPoker/src/pages/FinanceWorkspace*'
      - 'VinPoker/src/pages/ClubFinanceDashboard*'
      - '.github/workflows/finance-read-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: VinPoker
      - run: git diff --check
      - run: npx vitest run src/hooks/useClubFinanceSummary.readIntegrity.test.tsx src/hooks/accountant/useFinanceSummaryRpcOnly.test.tsx src/lib/financeSummaryRead.test.ts src/components/accountant/AccountantFinanceTab.readIntegrity.test.tsx src/components/Layout.unread.test.tsx src/pages/FinanceWorkspace.test.tsx src/pages/FinanceLegacyRedirect.test.tsx src/pages/AccountantDashboard.navigation.test.tsx src/lib/financePayrollPeriod.test.ts src/pages/StaffSalaryChot.test.tsx src/components/cashier/DealerPayrollTab.read.test.tsx src/hooks/staffSalary/useSalaryActions.test.tsx src/pages/CashierDashboard.tourEntry.test.tsx src/pages/ClubExpenses.test.tsx src/lib/financeNavigation.test.ts src/components/cashier/RevenueReportTab.test.tsx src/pages/ClubFinanceDashboard.acceptance.test.tsx --maxWorkers=1 --minWorkers=1
        working-directory: VinPoker
      - run: npx tsc --noEmit -p tsconfig.app.json --pretty false
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
