name: Profiles anonymous read integrity
on:
  pull_request:
    paths:
      - 'VinPoker/supabase/migrations/20270128000084_profiles_anon_public_projection_v1.sql'
      - 'VinPoker/tests/cashier/profilesAnonPrivileges.disposable.sql'
      - 'VinPoker/src/pages/PlayerProfile*'
      - '.github/workflows/profiles-anon-read-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: VinPoker
      - run: git diff --check
      - run: npm run check:migration-catalog && npm run check:credential-context
        working-directory: VinPoker
      - name: PostgreSQL 17 actual migration and anonymous column checks
        run: psql -X -v ON_ERROR_STOP=1 -f VinPoker/tests/cashier/profilesAnonPrivileges.disposable.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: fixture-only
      - run: npx vitest run src/pages/PlayerProfile.publicRead.test.tsx --maxWorkers=1 --minWorkers=1
        working-directory: VinPoker
      - run: npx tsc --noEmit -p tsconfig.app.json --pretty false
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
