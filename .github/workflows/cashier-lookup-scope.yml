name: Cashier lookup tenant scope
on:
  pull_request:
    paths:
      - 'VinPoker/supabase/functions/cashier-lookup-player/**'
      - 'VinPoker/supabase/functions/_shared/validate.ts'
      - 'VinPoker/tests/cashier/lookupPlayerScope.repro.mjs'
      - 'VinPoker/src/components/cashier/UnifiedLookupTab*'
      - '.github/workflows/cashier-lookup-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: VinPoker
      - run: node --test tests/cashier/lookupPlayerScope.repro.mjs
        working-directory: VinPoker
      - run: npx vitest run src/components/cashier/UnifiedLookupTab.readIntegrity.test.tsx --maxWorkers=1 --minWorkers=1
        working-directory: VinPoker
      - run: npx tsc --noEmit -p tsconfig.app.json --pretty false
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0
      - run: deno check --frozen --lock=deno.lock supabase/functions/cashier-lookup-player/index.ts
        working-directory: VinPoker
      - run: npm run check:credential-context
        working-directory: VinPoker
      - run: git diff --check
