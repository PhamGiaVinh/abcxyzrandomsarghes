name: Staff self payslips isolated DB
on:
  pull_request:
    paths:
      - '.github/workflows/staff-self-payslips-db.yml'
      - 'VinPoker/e2e/staff-ft-payslip.mock.spec.ts'
      - 'VinPoker/tests/staffSalary/l05Payslips.sql'
      - 'VinPoker/supabase/pending-migrations/20261119093017_staff_self_ft_payslips_v1.sql'
permissions:
  actions: read
  contents: read
jobs:
  staff-self-payslips-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: VinPoker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Verify the employee sees the recorded payment on mobile
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-publishable-key
          VITE_STAFF_FT_PAYSLIPS_V1: 'true'
        run: npm exec -- playwright test e2e/staff-ft-payslip.mock.spec.ts --workers=1
  staff-self-payslips-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vinpoker_ops_l05
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d vinpoker_ops_l05"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_l05
      CAPTURE_RUN: '44484017071'
      CAPTURE_SHA: '02c4d6cba8678c9d52feea055fc1f0714082bc77'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify capture provenance and restore schema on loopback
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/l05-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER"             '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and
             .event == "workflow_dispatch" and .actor.login == $owner and
             .path == ".github/workflows/capture-live-public-schema.yml"'             "$RUNNER_TEMP/l05-capture.json" > /dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/l05-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Verify saved payslips and authenticated actor boundaries
        working-directory: VinPoker
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = vinpoker_ops_l05
          psql -X -v ON_ERROR_STOP=1 -f tests/staffSalary/l05Payslips.sql
