name: Cashier Tour isolated real-backend E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cashier-tour-real-e2e.yml"
      - "VinPoker/scripts/ops/cashier-tour-real-e2e.sh"
      - "VinPoker/scripts/ops/clock-candidate-broadcast.mjs"
      - "VinPoker/scripts/ops/prepare-clock-payout-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/cashier-schema-mode.test.mjs"
      - "VinPoker/scripts/ops/operations-audience.mjs"
      - "VinPoker/scripts/ops/operations-audience-scope.mjs"
      - "VinPoker/scripts/ops/operations-audience-generation.mjs"
      - "VinPoker/scripts/ops/operations-audience-generation.test.mjs"
      - "VinPoker/scripts/ops/operations-audience-hand-delivery.mjs"
      - "VinPoker/scripts/ops/operations-audience-hand-delivery.test.mjs"
      - "VinPoker/scripts/ops/prepare-cashier-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tour-revenue-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-dealer-replacement-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-staff-salary-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tracker-start-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tracker-finish-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-operations-public-hud.mjs"
      - "VinPoker/supabase/pending-tests/operations_schema_freeze_fixture.sql"
      - "VinPoker/scripts/ops/select-cashier-schema-mode.mjs"
      - "VinPoker/e2e/cashier-tour-real.spec.ts"
      - "VinPoker/supabase/pending-tests/edge-dependency-cache/**"
      - "VinPoker/supabase/pending-tests/cashier-tour-edge-*.mjs"
      - "VinPoker/supabase/pending-tests/cashier_tour_edge_fixture.sql"
      - "VinPoker/supabase/pending-tests/fake-sepay-server.mjs"
      - "VinPoker/supabase/pending-tests/static-preview-server.mjs"
      - "VinPoker/supabase/functions/tournament-register/**"
      - "VinPoker/supabase/functions/sepay-reconcile/**"
      - "VinPoker/supabase/migrations/20270115000003_cashier_tour_money_v1.sql"
      - "VinPoker/supabase/migrations/20270128000014_dealer_checkin_club_shift_receipt_v1.sql"
      - "VinPoker/supabase/migrations/20270128000051_dealer_checkin_receipt_reconciliation_v1.sql"
      - "VinPoker/supabase/migration-archive/remote-history/recovered-source/20270115000011_cashier_refund_without_floor_clearance.sql"
      - "VinPoker/supabase/pending-tests/cashier_tour_money_v1.sql"
      - "VinPoker/supabase/pending-tests/cashier_tour_real_refund_fixture.sql"
      - "VinPoker/src/pages/ops/TourCashierWorkbench.tsx"
  workflow_dispatch:
    inputs:
      schema_mode:
        description: Historical pre03 migration proof or contemporary runtime proof
        type: choice
        options: [pre03, current]
        default: pre03
      ops_realtime:
        description: Contemporary isolated check-in WebSocket observation (not historical proof)
        type: boolean
        default: false
      clock_candidate_probe:
        description: Isolated canonical clock UI against exact30candidate migrations and real Broadcast flush RPC only
        type: boolean
        default: false

      operations_candidate_probe:
        description: Full isolated operational stages against exact30candidate; not mixed1000spectator proof
        type: boolean
        default: false

      operations_audience:
        description: Isolated anonymous HTTP/WS viewers during full candidate operational suite
        type: choice
        options: ['0', '10', '1000']
        default: '0'

      operations_audience_model:
        description: Selected-table product composition or retained combined grid+detail stress
        type: choice
        options: ['selected-table', 'grid-detail-stress']
        default: 'selected-table'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  isolated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the proof required by the changed source
        id: schema-mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_MODE: ${{ inputs.schema_mode || 'pre03' }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Runtime changes need the retained-schema real backend test.
            # Migration changes still require the original historical baseline.
            mode="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" |
              node VinPoker/scripts/ops/select-cashier-schema-mode.mjs)"
          fi
          case "$mode" in pre03|current) ;; *) exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - name: Verify pinned CLI flags and install test dependencies
        working-directory: VinPoker
        run: |
          test "$(supabase --version)" = "2.101.0"
          supabase start --help | grep -q -- '--network-id'
          supabase start --help | grep -q -- '--exclude'
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/ops/cashier-schema-mode.test.mjs scripts/ops/operations-audience-generation.test.mjs scripts/ops/operations-audience-hand-delivery.test.mjs
          node --test scripts/ops/telegram-test-sink.test.mjs
          node --test supabase/pending-tests/fake-sepay-server.test.mjs
      - name: Download latest owner-captured schema-only baseline
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
          CASHIER_SCHEMA_MODE: ${{ steps.schema-mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$CASHIER_SCHEMA_MODE" == current ]]; then
            recovery_id=38275767630
            recovery_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$recovery_id")"
            jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --argjson id "$recovery_id" '
              .id == $id and .conclusion == "success" and .event == "workflow_dispatch"
                and .workflow_id == 322144993 and .head_branch == "main"
                and .head_sha == "09cff8a829caf3f514a615b231ab96f4ed238757"
                and (.actor.login | ascii_downcase) == ($owner | ascii_downcase)
            ' <<<"$recovery_json" >/dev/null
            gh run download "$recovery_id" -n reviewed-operations-schema -D "${RUNNER_TEMP}/cashier-schema"
            gh run download "$recovery_id" -n reviewed-operations-schema-provenance -D "${RUNNER_TEMP}/cashier-provenance"
            node scripts/deploy/validate-live-public-schema-artifact.mjs \
              --artifact-directory "${RUNNER_TEMP}/cashier-schema" \
              --operations-recovery-provenance "${RUNNER_TEMP}/cashier-provenance/reviewed-operations-schema.provenance.json" \
              --recovery-run-id "$recovery_id"
            echo "Runtime-only schema: reviewed recovery $recovery_id; not pre03 migration proof"
            exit 0
          fi
          # This owner capture predates live Cashier 03 and is schema-only.
          # A fresh capture would already include 03, so it cannot be used as
          # the pre-03 baseline for this isolated migration chain.
          capture_id=35982674365
          capture_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$capture_id")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --argjson id "$capture_id" '
            .id == $id and .conclusion == "success" and .event == "workflow_dispatch"
              and .head_branch == "main"
              and (.actor.login | ascii_downcase) == ($owner | ascii_downcase)
          ' <<<"$capture_json" >/dev/null
          gh run download "$capture_id" -n live-public-schema -D "${RUNNER_TEMP}/cashier-schema"
          node scripts/deploy/validate-live-public-schema-artifact.mjs \
            --artifact-directory "${RUNNER_TEMP}/cashier-schema"
          echo "Schema baseline: owner capture run $capture_id (pre-Cashier-03)"
      - name: Isolate empty local Supabase before any application migration
        working-directory: VinPoker
        env:
          SCHEMA_ARTIFACT_DIRECTORY: ${{ runner.temp }}/cashier-schema
          CASHIER_SCHEMA_MODE: ${{ steps.schema-mode.outputs.mode }}
          LOCAL_OPERATIONS_REALTIME: ${{ inputs.ops_realtime && '1' || '0' }}
          LOCAL_OPERATIONS_AUDIENCE: ${{ inputs.operations_audience || '0' }}
          LOCAL_OPERATIONS_AUDIENCE_MODEL: ${{ inputs.operations_audience_model || 'grid-detail-stress' }}
          LOCAL_OPERATIONS_CANDIDATE_PROBE: ${{ inputs.operations_candidate_probe && '1' || '0' }}
          LOCAL_CLOCK_CANDIDATE_PROBE: ${{ inputs.clock_candidate_probe && '1' || '0' }}
        run: bash scripts/ops/cashier-tour-real-e2e.sh
      - name: Sanitized Cashier HTTP latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashier-http-latency-${{ github.sha }}
          path: VinPoker/output/operations-latency/*-http.json
          if-no-files-found: ignore
          retention-days: 7
