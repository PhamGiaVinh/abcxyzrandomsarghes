name: Cashier Tour isolated real-backend E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cashier-tour-real-e2e.yml"
      - "VinPoker/scripts/ops/cashier-tour-real-e2e.sh"
      - "VinPoker/scripts/ops/clock-candidate-broadcast.mjs"
      - "VinPoker/scripts/ops/prepare-clock-payout-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-prize-close-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-manual-cards-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-manual-cards-runtime-dependencies.test.mjs"
      - "VinPoker/scripts/ops/prepare-prize-close-runtime-dependencies.test.mjs"
      - "VinPoker/scripts/ops/cashier-schema-mode.test.mjs"
      - "VinPoker/scripts/ops/operations-audience.mjs"
      - "VinPoker/scripts/ops/operations-db-pressure.mjs"
      - "VinPoker/scripts/ops/operations-db-pressure.sql"
      - "VinPoker/scripts/ops/isolated-postgrest-pool.mjs"
      - "VinPoker/scripts/ops/operations-postgrest-pool.mjs"
      - "VinPoker/scripts/ops/operations-rpc-profile.sql"
      - "VinPoker/scripts/ops/operations-audience-scope.mjs"
      - "VinPoker/scripts/ops/operations-audience-readiness.test.mjs"
      - "VinPoker/scripts/ops/operations-audience-generation.mjs"
      - "VinPoker/scripts/ops/operations-audience-generation.test.mjs"
      - "VinPoker/scripts/ops/operations-audience-hand-delivery.mjs"
      - "VinPoker/scripts/ops/operations-audience-hand-delivery.test.mjs"
      - "VinPoker/scripts/ops/prepare-cashier-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tour-revenue-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-dealer-replacement-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-staff-salary-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tracker-start-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-tracker-finish-runtime-dependencies.mjs"
      - "VinPoker/scripts/ops/prepare-operations-public-hud.mjs"
      - "VinPoker/scripts/ops/operations-hud-control.mjs"
      - "VinPoker/scripts/ops/operations-hud-control.test.mjs"
      - "VinPoker/supabase/pending-tests/operations_schema_freeze_fixture.sql"
      - "VinPoker/scripts/ops/select-cashier-schema-mode.mjs"
      - "VinPoker/scripts/ops/cashier-source342-344-qualified-scope.json"
      - "VinPoker/scripts/ops/fixtures/cashier-source342-344-runtime-receipt.json"
      - "VinPoker/scripts/ops/cashier-source-package-evidence.mjs"
      - "VinPoker/scripts/ops/cashier-source-package.test.mjs"
      - "VinPoker/scripts/ops/cashier-hud35-qualified-scope.json"
      - "VinPoker/scripts/ops/fixtures/cashier-ci-hud35-qualified-receipt-20261107.json"
      - "VinPoker/e2e/cashier-tour-real.spec.ts"
      - "VinPoker/supabase/pending-tests/edge-dependency-cache/**"
      - "VinPoker/supabase/pending-tests/cashier-tour-edge-*.mjs"
      - "VinPoker/supabase/pending-tests/cashier_tour_edge_fixture.sql"
      - "VinPoker/supabase/pending-tests/tournament-reentry-transport.ts"
      - "VinPoker/supabase/pending-tests/reentry_transport_notification_fault.sql"
      - "VinPoker/supabase/pending-tests/reentry_transport_timeout_rollback.sql"
      - "VinPoker/tests/cashier/reentryTransportCandidate.test.mjs"
      - "VinPoker/tests/cashier/reentryDisconnect.native.mjs"
      - "VinPoker/supabase/pending-tests/fake-sepay-server.mjs"
      - "VinPoker/supabase/pending-tests/fake-sepay-server.test.mjs"
      - "VinPoker/supabase/pending-tests/static-preview-server.mjs"
      - "VinPoker/supabase/functions/tournament-register/**"
      - "VinPoker/supabase/functions/tournament-historical-settlement/**"
      - "VinPoker/supabase/functions/sepay-reconcile/**"
      - "VinPoker/supabase/migrations/20270115000003_cashier_tour_money_v1.sql"
      - "VinPoker/supabase/migrations/20270128000014_dealer_checkin_club_shift_receipt_v1.sql"
      - "VinPoker/supabase/migrations/20270128000051_dealer_checkin_receipt_reconciliation_v1.sql"
      - "VinPoker/supabase/migration-archive/remote-history/recovered-source/20270115000011_cashier_refund_without_floor_clearance.sql"
      - "VinPoker/supabase/pending-tests/cashier_tour_money_v1.sql"
      - "VinPoker/supabase/pending-tests/cashier_tour_real_refund_fixture.sql"
      - "VinPoker/src/pages/ops/TourCashierWorkbench.tsx"
  workflow_dispatch:
    inputs:
      source_batch_probe:
        description: Isolated bounded source batch344; requires full pending_source_probe
        type: boolean
        default: false
      pending_source_probe:
        description: Isolated pending-source fenced outcome; requires full source_generation_probe
        type: boolean
        default: false
      source_generation_probe:
        description: Isolated migration342 worker-row contention candidate; never production apply
        type: boolean
        default: false
      diagnostic_scope:
        description: Target only unresolved payment or check-in failure; never full acceptance
        type: choice
        options: [none, cashier-payment, dealer-checkin]
        default: none
      schema_mode:
        description: Historical pre03 migration proof or contemporary runtime proof
        type: choice
        options: [pre03, current]
        default: pre03
      ops_realtime:
        description: Contemporary isolated check-in WebSocket observation (not historical proof)
        type: boolean
        default: false
      clock_candidate_probe:
        description: Isolated canonical clock UI against exact31candidate migrations and real Broadcast flush RPC only
        type: boolean
        default: false

      operations_candidate_probe:
        description: Full isolated operational stages against exact31candidate; not mixed1000spectator proof
        type: boolean
        default: false

      operations_audience:
        description: Isolated anonymous HTTP/WS viewers during full candidate operational suite
        type: choice
        options: ['0', '10', '1000']
        default: '0'

      operations_audience_model:
        description: Selected-table product composition or retained combined grid+detail stress
        type: choice
        options: ['selected-table', 'grid-detail-stress']
        default: 'selected-table'

      reentry_transport_probe:
        description: Pending composite reentry RPC/Edge;isolated current operational mode only
        type: boolean
        default: false

      correction_undo_probe:
        description: Isolated current31+32+33 Auth HTTP Undo and retry proof
        type: boolean
        default: false

      redraw_probe:
        description: Final isolated Auth HTTP seat-lock and redraw conservation probe
        type: boolean
        default: false

      prize_close_probe:
        description: Isolated full34 Floor/Cashier paid-prize HTTP journey after audience drain
        type: boolean
        default: false

      reentry_fault_mode:
        description: Inject notification faults at10viewers or measure healthy candidate operations
        type: choice
        options: ['failure-injection', 'healthy']
        default: 'failure-injection'

      operations_rest_pool:
        description: Isolated1000-viewer pool comparison;fixed resources,no hosted change
        type: choice
        options: ['10', '20']
        default: '10'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  isolated-e2e:
    # A manual diagnostic PASS must never satisfy the full-suite required check.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_scope && inputs.diagnostic_scope != 'none' && format('targeted-{0}', inputs.diagnostic_scope) || 'isolated-e2e' }}
    # Playwright1.60 is pinned in package-lock; Ubuntu24.04 is supported.
    # The existing Tracker browser CI already verified this runner combination.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the proof required by the changed source
        id: schema-mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_MODE: ${{ inputs.schema_mode || 'pre03' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Execute the protected-base validator, never the PR's own exemption.
            # Unknown/altered SQL retains historical proof. Exact qualified HUD35
            # still runs the unchanged current-schema real Cashier E2E below.
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            trusted_selector="$RUNNER_TEMP/select-cashier-schema-mode.mjs"
            git show "$BASE_SHA:VinPoker/scripts/ops/select-cashier-schema-mode.mjs" > "$trusted_selector"
            mode="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" |
              node "$trusted_selector" "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA")"
          fi
          package=none
          if [[ "$mode" == current-source342 ]]; then
            package=source342
            mode=current
          fi
          case "$mode" in pre03|current) ;; *) exit 1 ;; esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - name: Verify pinned CLI flags and install test dependencies
        working-directory: VinPoker
        run: |
          test "$(supabase --version)" = "2.101.0"
          supabase start --help | grep -q -- '--network-id'
          supabase start --help | grep -q -- '--exclude'
          npm ci --ignore-scripts --no-audit --no-fund
          # Immutable source objects for the real Git-tree mutation fixtures.
          # Keep tests reproducible after the candidate branch is removed.
          git cat-file -e '26d829241c1da649eae4ec37aaff398ab00a5173^{commit}' ||
            git fetch --no-tags origin 26d829241c1da649eae4ec37aaff398ab00a5173
          node --test scripts/ops/prepare-manual-cards-runtime-dependencies.test.mjs scripts/ops/cashier-schema-mode.test.mjs scripts/ops/prepare-prize-close-runtime-dependencies.test.mjs scripts/ops/operations-audience-readiness.test.mjs scripts/ops/operations-audience-generation.test.mjs scripts/ops/operations-audience-hand-delivery.test.mjs scripts/ops/operations-hud-control.test.mjs
          node --test scripts/ops/telegram-test-sink.test.mjs
          git cat-file -e 'c69bce72ca98332ac4740808b05db01bf7bed398^{commit}' ||
            git fetch --no-tags origin c69bce72ca98332ac4740808b05db01bf7bed398
          node --test scripts/ops/cashier-source-package.test.mjs
          node --test tests/cashier/reentryTransportCandidate.test.mjs
          node --test supabase/pending-tests/fake-sepay-server.test.mjs
      - name: Download latest owner-captured schema-only baseline
        working-directory: VinPoker
        env:
          GH_TOKEN: ${{ github.token }}
          CASHIER_SCHEMA_MODE: ${{ steps.schema-mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$CASHIER_SCHEMA_MODE" == current ]]; then
            recovery_id=38275767630
            recovery_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$recovery_id")"
            jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --argjson id "$recovery_id" '
              .id == $id and .conclusion == "success" and .event == "workflow_dispatch"
                and .workflow_id == 322144993 and .head_branch == "main"
                and .head_sha == "09cff8a829caf3f514a615b231ab96f4ed238757"
                and (.actor.login | ascii_downcase) == ($owner | ascii_downcase)
            ' <<<"$recovery_json" >/dev/null
            gh run download "$recovery_id" -n reviewed-operations-schema -D "${RUNNER_TEMP}/cashier-schema"
            gh run download "$recovery_id" -n reviewed-operations-schema-provenance -D "${RUNNER_TEMP}/cashier-provenance"
            node scripts/deploy/validate-live-public-schema-artifact.mjs \
              --artifact-directory "${RUNNER_TEMP}/cashier-schema" \
              --operations-recovery-provenance "${RUNNER_TEMP}/cashier-provenance/reviewed-operations-schema.provenance.json" \
              --recovery-run-id "$recovery_id"
            echo "Runtime-only schema: reviewed recovery $recovery_id; not pre03 migration proof"
            exit 0
          fi
          # This owner capture predates live Cashier 03 and is schema-only.
          # A fresh capture would already include 03, so it cannot be used as
          # the pre-03 baseline for this isolated migration chain.
          capture_id=35982674365
          capture_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$capture_id")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --argjson id "$capture_id" '
            .id == $id and .conclusion == "success" and .event == "workflow_dispatch"
              and .head_branch == "main"
              and (.actor.login | ascii_downcase) == ($owner | ascii_downcase)
          ' <<<"$capture_json" >/dev/null
          gh run download "$capture_id" -n live-public-schema -D "${RUNNER_TEMP}/cashier-schema"
          node scripts/deploy/validate-live-public-schema-artifact.mjs \
            --artifact-directory "${RUNNER_TEMP}/cashier-schema"
          echo "Schema baseline: owner capture run $capture_id (pre-Cashier-03)"
      - name: Run isolated backend, browser and operational checks
        working-directory: VinPoker
        env:
          SCHEMA_ARTIFACT_DIRECTORY: ${{ runner.temp }}/cashier-schema
          CASHIER_SCHEMA_MODE: ${{ steps.schema-mode.outputs.mode }}
          # Current PR qualification includes cross-actor UI delivery assertions.
          # Exercise the real Realtime service for their healthy-connection SLO.
          LOCAL_OPERATIONS_REALTIME: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.ops_realtime) && '1' || '0' }}
          # The full final stages require the real admission/schema-freeze
          # protocol. Ten viewers are a smoke profile, never1000 qualification.
          LOCAL_OPERATIONS_AUDIENCE: ${{ (github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') && '10' || inputs.operations_audience || '0' }}
          LOCAL_OPERATIONS_AUDIENCE_MODEL: ${{ (steps.schema-mode.outputs.package == 'source342' || (github.event_name == 'pull_request' && github.event.pull_request.number == 1635)) && 'selected-table' || inputs.operations_audience_model || 'grid-detail-stress' }}
          # Current PRs render the candidate frontend, so qualify its matching
          # isolated backend and all operational stages rather than old RPCs.
          LOCAL_OPERATIONS_CANDIDATE_PROBE: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.operations_candidate_probe) && '1' || '0' }}
          LOCAL_REENTRY_TRANSPORT_PROBE: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.reentry_transport_probe) && '1' || '0' }}
          LOCAL_CORRECTION_UNDO_PROBE: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.correction_undo_probe) && '1' || '0' }}
          LOCAL_OPERATIONS_PRIZE_CLOSE_PROBE: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.prize_close_probe) && '1' || '0' }}
          LOCAL_OPERATIONS_REDRAW_PROBE: ${{ ((github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') || inputs.redraw_probe) && '1' || '0' }}
          LOCAL_REENTRY_FAULT_MODE: ${{ (github.event_name == 'pull_request' && steps.schema-mode.outputs.mode == 'current') && 'healthy' || inputs.reentry_fault_mode || 'failure-injection' }}
          LOCAL_OPERATIONS_REST_POOL: ${{ inputs.operations_rest_pool || '10' }}
          LOCAL_CLOCK_CANDIDATE_PROBE: ${{ inputs.clock_candidate_probe && '1' || '0' }}
          LOCAL_OPERATIONS_DIAGNOSTIC_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_scope || 'none' }}
          LOCAL_SOURCE_GENERATION_PROBE: ${{ (steps.schema-mode.outputs.package == 'source342' || (github.event_name == 'workflow_dispatch' && inputs.source_generation_probe)) && '1' || '0' }}
          LOCAL_PENDING_SOURCE_PROBE: ${{ (steps.schema-mode.outputs.package == 'source342' || (github.event_name == 'workflow_dispatch' && inputs.pending_source_probe)) && '1' || '0' }}
          LOCAL_SOURCE_BATCH_PROBE: ${{ (steps.schema-mode.outputs.package == 'source342' || (github.event_name == 'workflow_dispatch' && inputs.source_batch_probe)) && '1' || '0' }}
          REQUIRED_SOURCE_PACKAGE: ${{ steps.schema-mode.outputs.package }}
          POLICY_INTEGRATION_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1635 && '1' || '0' }}
          POLICY_PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          policy_root="$PWD"
          runtime_root="$PWD"
          collect_policy_runtime() {
            if [[ "$runtime_root" != "$policy_root" ]]; then
              mkdir -p "$policy_root/output/operations-latency"
              if [[ -d "$runtime_root/output/operations-latency" ]]; then
                cp -a "$runtime_root/output/operations-latency/." "$policy_root/output/operations-latency/"
              fi
              printf '{"kind":"POLICY_ONLY_PINNED_RUNTIME","policySha":"%s","orchestrationSha":"%s","runtimeSha":"c69bce72ca98332ac4740808b05db01bf7bed398","qualification":false,"productionChanged":false}\n' \
                "$POLICY_HEAD_SHA" "$GITHUB_SHA" > "$policy_root/output/operations-latency/operations-policy-integration-source-http.json"
            fi
          }
          trap collect_policy_runtime EXIT
          if [[ "$POLICY_INTEGRATION_PR" == 1 ]]; then
            # Test policy integration against its exact reviewed candidate, not
            # main's known pre342 spectator-writer contention. No other PR or
            # SQL diff may use this one-off bootstrap; keep both source IDs.
            node scripts/ops/cashier-source-package-evidence.mjs --bootstrap-scope \
              "$GITHUB_REPOSITORY" "$POLICY_PR_NUMBER" "$CASHIER_SCHEMA_MODE" \
              "$REQUIRED_SOURCE_PACKAGE" "$POLICY_BASE_SHA" "$POLICY_HEAD_SHA"
            git worktree add --detach "$RUNNER_TEMP/source342-runtime" c69bce72ca98332ac4740808b05db01bf7bed398
            runtime_root="$RUNNER_TEMP/source342-runtime/VinPoker"
            cmp package-lock.json "$runtime_root/package-lock.json"
            cp -a node_modules "$runtime_root/node_modules"
            export LOCAL_SOURCE_GENERATION_PROBE=1 LOCAL_PENDING_SOURCE_PROBE=1 LOCAL_SOURCE_BATCH_PROBE=1
            REQUIRED_SOURCE_PACKAGE=source342
          fi
          (cd "$runtime_root" && bash scripts/ops/cashier-tour-real-e2e.sh)
          if [[ "$REQUIRED_SOURCE_PACKAGE" == source342 || "$LOCAL_SOURCE_GENERATION_PROBE" == 1 || "$LOCAL_PENDING_SOURCE_PROBE" == 1 || "$LOCAL_SOURCE_BATCH_PROBE" == 1 ]]; then
            node scripts/ops/cashier-source-package-evidence.mjs "$runtime_root/output/operations-latency"
          fi
      - name: Sanitized Cashier runtime latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashier-http-latency-${{ github.sha }}
          path: |
            VinPoker/output/operations-latency/*-http.json
            VinPoker/output/operations-latency/reentry-transport-notification-timeout-native.json
            VinPoker/output/operations-latency/reentry-transport-disconnect-native.json
            VinPoker/output/operations-latency/reentry-bank-ambiguity-native-conservation.json
          if-no-files-found: ignore
          retention-days: 7
