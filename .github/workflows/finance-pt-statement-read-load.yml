name: PT standalone original-schema read load
on:
  pull_request:
    types: [labeled]
permissions: {actions: read, contents: read}
jobs:
  standalone-read-load:
    if: >-
      github.event.label.name == 'qualify-pt-standalone-read-load' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'PhamGiaVinh/abcxyzrandomsarghes'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: vinpoker_ops_pt_read_release_load}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d vinpoker_ops_pt_read_release_load"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_pt_read_release_load
      SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
      CAPTURE_RUN: '45651278424'
      CAPTURE_SHA: 'c9dba24211152ddf5f010a46d0afab118cfbf482'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Verify grader rejection cases
        working-directory: VinPoker
        run: node --test tests/financePayrollReadRelease/load-qualification.test.mjs
      - name: Restore only approved captured original schema
        working-directory: VinPoker
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" > "$RUNNER_TEMP/pt-load-capture.json"
          jq -e --arg sha "$CAPTURE_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" '.conclusion=="success" and .head_sha==$sha and .head_branch=="main" and .event=="workflow_dispatch" and .actor.login==$owner and .path==".github/workflows/capture-live-public-schema.yml"' "$RUNNER_TEMP/pt-load-capture.json" >/dev/null
          export SCHEMA_ARTIFACT_DIR="$RUNNER_TEMP/pt-load-schema"
          gh run download "$CAPTURE_RUN" -R "$GITHUB_REPOSITORY" -n live-public-schema -D "$SCHEMA_ARTIFACT_DIR"
          node scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
          export SCHEMA_ARTIFACT_SHA256="$(cut -d ' ' -f1 "$SCHEMA_ARTIFACT_DIR/live-public-schema.sha256")"
          test "$SCHEMA_ARTIFACT_SHA256" = f81104251d6c79fdae537e0ca2faa7afa2ddc186eafadcb3bd4781276478b7d8
          node scripts/ops/restore-schema-test-baseline.mjs
      - name: Install only qualified read RPCs without changing original catalog
        working-directory: VinPoker
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -f tests/financePayrollReadRelease/catalog-fingerprint.sql > "$RUNNER_TEMP/pt-load-catalog-before"
          psql -X -v ON_ERROR_STOP=1 -f supabase/pending-migrations/finance_pt_statement_reads_v1.sql
          test "$(psql -XAt -v ON_ERROR_STOP=1 -f tests/financePayrollReadRelease/catalog-fingerprint.sql)" = "$(cat "$RUNNER_TEMP/pt-load-catalog-before")"
      - name: Seed explicit synthetic read volume and real legacy references
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/financePayrollReadRelease/load.seed.sql
      - name: Measure 30 minutes 20 linked-self readers through real PostgREST
        working-directory: VinPoker
        run: node tests/financePayrollReadRelease/read-load.mjs
      - name: Upload only sanitized synthetic aggregate and latency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: pt-standalone-read-load-sanitized, path: '${{ runner.temp }}/pt-standalone-read-load.json', if-no-files-found: warn, retention-days: 30}
      - name: Remove runner-local schema
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pt-load-schema"
